  <style>
    :root {
      --bg: #12151c;
      --surface-1: #1b2029;
      --surface-2: #242b38;
      --border: #323b4c;
      --border-soft: #262d3a;
      --amber: #e8873a;
      --amber-bg: rgba(232, 135, 58, .14);
      --text-1: #f2f0ea;
      --text-2: #a9b1c3;
      --text-3: #6b7386;
      --radius-lg: 18px;
      --font-display: 'Oswald', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-family: var(--font-display);
      margin: 0;
      letter-spacing: .02em;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 60px;
    }

    header {
      margin-bottom: 36px;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-3);
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
    }

    .app-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface-1);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, background .15s;
    }

    .app-card:hover,
    .app-card:active {
      border-color: var(--amber);
      background: var(--surface-2);
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      flex-shrink: 0;
      background: var(--amber-bg);
      color: var(--amber);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
    }

    .app-info {
      min-width: 0;
    }

    .app-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .app-desc {
      font-size: 12.5px;
      color: var(--text-2);
      margin-top: 2px;
    }

    .app-card .arrow {
      margin-left: auto;
      color: var(--text-3);
      font-size: 18px;
      flex-shrink: 0;
    }

    .app-card.placeholder {
      border-style: dashed;
      color: var(--text-3);
      cursor: default;
      pointer-events: none;
    }

    .app-card.placeholder .app-icon {
      background: var(--surface-2);
      color: var(--text-3);
    }

    .app-card.placeholder .app-desc {
      color: var(--text-3);
    }

    footer {
      margin-top: 40px;
      font-size: 11.5px;
      color: var(--text-3);
      font-family: var(--font-mono);
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="brand-sub">Herramientas del equipo</div>
      <h1>Apps</h1>
    </header>

    <div class="app-grid">
      <a class="app-card" href="attendance/">
        <div class="app-icon">🏀</div>
        <div class="app-info">
          <div class="app-name">Control de Asistencia</div>
          <div class="app-desc">Registro de asistencia a entrenamientos y partidos</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="app-card" href="shot-tracking/">
        <div class="app-icon">🏀</div>
        <div class="app-info">
          <div class="app-name">Control de Tiro</div>
          <div class="app-desc">Registro de series y estadísticas de entrenamiento</div>
        </div>
        <div class="arrow">›</div>
      </a>

      </div>
    </div> -->
    </div>

    <footer>github.io</footer>
  </main>
</body>
