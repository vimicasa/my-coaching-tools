<style>
:root{
  --bg:#F5F4EF;
  --surface:#FFFFFF;
  --surface-2:#EFEEE7;
  --ink:#16202A;
  --ink-soft:#5B6670;
  --ink-faint:#8A929B;
  --line:#DEDCD1;
  --accent:#E8590C;
  --accent-ink:#FFFFFF;
  --navy:#16324A;
  --navy-2:#1F4260;

  --present:#2F9E44;
  --present-bg:#E9F6EC;
  --late:#D9A404;
  --late-bg:#FCF3D6;
  --injured:#E03131;
  --injured-bg:#FBE7E7;
  --partial:#F76707;
  --partial-bg:#FDEBDD;
  --individual:#9C6ADE;
  --individual-bg:#F1E9FB;
  --justified:#5F7A9A;
  --justified-bg:#E9EDF3;
  --unjustified:#343A40;
  --unjustified-bg:#E4E5E6;

  --radius-s:8px;
  --radius-m:14px;
  --radius-l:20px;
  --shadow:0 1px 2px rgba(22,32,42,.06), 0 8px 24px -12px rgba(22,32,42,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  min-height:100vh;
}
.disp{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.2px;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  background:var(--navy);
  color:#fff;
  padding:14px 20px 0 20px;
  position:sticky;top:0;z-index:40;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .disp{font-size:22px;line-height:1;}
.brand .season{color:#B9C6D3;font-size:13px;font-weight:500;}
.save-status{
  font-size:12px;font-weight:600;color:#CFE0EB;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:#4FCB7B;}
.save-status.pending .dot{background:#F2B705;}
.topbar .tabs{display:flex;gap:2px;margin-top:14px;}
.tab-btn{
  flex:1;border:none;background:transparent;color:#9FB3C4;
  padding:12px 8px 14px;font-size:15px;font-weight:600;cursor:pointer;
  border-bottom:3px solid transparent;font-family:'Work Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent);}

.menubar{
  display:flex;gap:8px;padding:10px 20px;background:var(--surface-2);
  border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap;
}
.chip-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.chip-btn:active{transform:scale(.97);}
.chip-btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}

main{flex:1;padding:18px 20px 90px;max-width:1100px;margin:0 auto;width:100%;}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:var(--radius-s);padding:12px 18px;font-size:15px;
  font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
}
.btn-accent{background:var(--accent);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn-danger{background:var(--injured-bg);color:var(--injured);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:8px;}

/* ---------- Session header (Asistencia tab) ---------- */
.session-picker{
  display:flex;align-items:center;gap:10px;overflow-x:auto;padding:2px 0 12px;
}
.session-pill{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:9px 14px;cursor:pointer;text-align:left;min-width:120px;
}
.session-pill.active{border-color:var(--navy);background:var(--navy);color:#fff;}
.session-pill .d1{font-size:11px;font-weight:600;opacity:.7;text-transform:uppercase;}
.session-pill .d2{font-size:14px;font-weight:700;}

.session-header{
  background:var(--surface);border-radius:var(--radius-l);padding:18px 20px;
  box-shadow:var(--shadow);margin-bottom:16px;
}
.session-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.session-title{font-size:26px;line-height:1.1;}
.session-sub{color:var(--ink-soft);font-size:14px;margin-top:4px;font-weight:500;}
.session-type-badge{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.5px;
}
.type-training{background:#E9EEF3;color:var(--navy-2);}
.type-game{background:#FCEBD9;color:var(--accent);}
.session-count{font-size:14px;color:var(--ink-soft);margin-top:10px;font-weight:600;}
.session-notes{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic;}
.session-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

/* ---------- Player rows ---------- */
.player-list{display:flex;flex-direction:column;gap:8px;}
.player-row{
  background:var(--surface);border-radius:var(--radius-m);
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  box-shadow:var(--shadow);border-left:5px solid var(--ink-faint);
  cursor:pointer;user-select:none;
}
.player-row:active{transform:scale(.995);}
.jersey{
  width:40px;height:40px;border-radius:50%;background:var(--surface-2);
  color:var(--navy);display:flex;align-items:center;justify-content:center;

<body>
<div id="app"></div>
<div id="overlays"></div>

<script>
(function(){
"use strict";

/* ============================================================
   1. UTILIDADES / RNG SEMILLA
   ============================================================ */
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function pad(n,l){n=String(n);while(n.length<l)n="0"+n;return n;}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);}
function fmtDateLong(iso){
  const d=parseISO(iso);
  const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return dias[d.getDay()]+" "+d.getDate()+" "+meses[d.getMonth()];
}
function fmtDateShort(iso){
  const d=parseISO(iso);
  const meses=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d.getDate()+" "+meses[d.getMonth()];
}
function parseISO(iso){
  const[y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d);
}
function isValidISODate(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso))return false;
  const d=parseISO(iso);
  return d.getFullYear()===Number(iso.slice(0,4)) && !isNaN(d.getTime());
}
function isoWeek(iso){
  const d=parseISO(iso);
  const target=new Date(d.valueOf());
  const dayNr=(d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday=target.valueOf();
  target.setMonth(0,1);
  if(target.getDay()!==4){target.setMonth(0,1+((4-target.getDay())+7)%7);}
  return 1+Math.ceil((firstThursday-target)/604800000);
}
function uid(prefix,existingIds){
  let n=1;
  existingIds.forEach(id=>{
    const m=id.match(new RegExp("^"+prefix+"-(\\d+)$"));
    if(m)n=Math.max(n,parseInt(m[1],10)+1);
  });
  let id=prefix+"-"+pad(n,3);
  while(existingIds.has(id)){ n++; id=prefix+"-"+pad(n,3); }
  return id;
}
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms);};}

/* ============================================================
   2. CATÁLOGO DE ESTADOS
   ============================================================ */
const STATUS = {
  present:      {label:"Asistió",               short:"Asistió",   icon:"🟢", counts:"participation"},
  late:         {label:"Llegó tarde",            short:"Tarde",     icon:"🟡", counts:"participation"},
  injured:      {label:"Lesionado antes",        short:"Lesionado", icon:"🔴", counts:"absence"},
  partial:      {label:"No acabó el entreno",    short:"No acabó",  icon:"🟠", counts:"participation"},
  individual:   {label:"Trabajo individual",     short:"Individual",icon:"🟣", counts:"participation"},
  justified:    {label:"Ausencia justificada", short:"Justif.",   icon:"⚪", counts:"absence"},
  unjustified:  {label:"Ausencia no justificada",short:"No justif.",icon:"⚫", counts:"absence"}
};
const STATUS_ORDER=["present","late","injured","partial","individual","justified","unjustified"];

/* ============================================================
   3. UMBRALES DE ATENCIÓN (centralizados)
   ============================================================ */
const ALERT_THRESHOLDS={
  minAvailability:80,      // % por debajo del cual se alerta
  minSessionsForAvailabilityAlert:5, // no alertar con muestras muy pequeñas
  maxLateMinutes:30,
  maxPartialSessions:2,
  maxUnjustified:1,
  maxInjuredSessions:3
};

/* ============================================================
   4. ESTADO GLOBAL Y PERSISTENCIA
   ============================================================ */
const STORAGE_KEY="baloncesto_asistencia_v1";
let state=null;
let lastExportedSnapshot=null;

function emptyState(){
  return {
    version:1,
    season:{name:seasonNameFromDate(todayISO())},
    players:[],
    roster:[],
    sessions:[],
    attendance:[]
  };
}
function seasonNameFromDate(iso){
  const d=parseISO(iso);
  const y=d.getFullYear();
  return (d.getMonth()>=6)? (y+"/"+String(y+1).slice(2)) : ((y-1)+"/"+String(y).slice(2));
}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){ return false; }
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function isDirtyForExport(){
  return JSON.stringify(state)!==lastExportedSnapshot;
}
function markExported(){
  lastExportedSnapshot=JSON.stringify(state);
}
function persist(){
  saveLocal();
  render();
}

/* ============================================================
   5. LÓGICA DE NEGOCIO (roster / sesiones / cálculos)
   ============================================================ */
function isPlayerActiveOn(playerId,iso){
  return state.roster.some(r=>r.player_id===playerId && r.from<=iso && (r.to===null || r.to>=iso));
}
function getActivePlayersOn(iso){
  return state.players.filter(p=>isPlayerActiveOn(p.id,iso));
}
function currentRosterEntry(playerId){
  return state.roster.find(r=>r.player_id===playerId && r.to===null);
}
function earliestActiveRosterFrom(){
  const froms=state.roster.filter(r=>r.to===null).map(r=>r.from);
  if(!froms.length) return todayISO();
  return froms.reduce((a,b)=> a<b?a:b);
}
function isPlayerCurrentlyActive(playerId){
  return !!currentRosterEntry(playerId);
}
function getAttendance(sessionId,playerId){
  return state.attendance.find(a=>a.session_id===sessionId && a.player_id===playerId);
}
function sessionsById(){
  const m={}; state.sessions.forEach(s=>m[s.id]=s); return m;
}
function playersById(){
  const m={}; state.players.forEach(p=>m[p.id]=p); return m;
}

function createSession({date,type,name,time,notes}){
  const id=uid("session",new Set(state.sessions.map(s=>s.id)));
  const session={id,date,type,name:name||(type==="game"?"Partido":"Entrenamiento"),time:time||null,notes:notes||""};
  state.sessions.push(session);
  // autocompletar asistencia: todos los jugadores activos -> present
  getActivePlayersOn(date).forEach(p=>{
    state.attendance.push({session_id:id,player_id:p.id,status:"present"});
  });
  return session;
}
function duplicateSession(sessionId,newDate){
  const src=state.sessions.find(s=>s.id===sessionId);
  if(!src)return null;
  return createSession({date:newDate||src.date,type:src.type,name:src.name,time:src.time,notes:""});
}
function deleteSession(sessionId){
  state.sessions=state.sessions.filter(s=>s.id!==sessionId);
  state.attendance=state.attendance.filter(a=>a.session_id!==sessionId);
}
function setAttendanceStatus(sessionId,playerId,patch){
  let rec=getAttendance(sessionId,playerId);
  if(!rec){
    rec={session_id:sessionId,player_id:playerId,status:"present"};
    state.attendance.push(rec);
  }
  Object.assign(rec,patch);
  if(rec.status!=="late") delete rec.late_minutes;
  if(rec.comment==="") delete rec.comment;
}
function markAllPresent(sessionId){
  const session=state.sessions.find(s=>s.id===sessionId);
  if(!session)return;
  getActivePlayersOn(session.date).forEach(p=>{
    setAttendanceStatus(sessionId,p.id,{status:"present"});
    const rec=getAttendance(sessionId,p.id);
    delete rec.late_minutes; delete rec.comment;
  });
}

/* ---- filtros ---- */
function filterSessionsByDate(sessions,filter){
  if(!filter || filter.mode==="all")return sessions;
  let from=filter.from, to=filter.to;
  const today=todayISO();
  if(filter.mode==="lastMonth"){ from=addDaysISO(today,-30); to=today; }
  else if(filter.mode==="last3Months"){ from=addDaysISO(today,-90); to=today; }
  return sessions.filter(s=> (!from||s.date>=from) && (!to||s.date<=to) );
}
function addDaysISO(iso,days){
  const d=parseISO(iso); d.setDate(d.getDate()+days);
  return d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
}
function filterSessionsByType(sessions,type){
  if(!type||type==="all")return sessions;
  return sessions.filter(s=>s.type===type);
}
function filterPlayers(players,selectedIds){
  if(!selectedIds || selectedIds.length===0)return players;
  return players.filter(p=>selectedIds.includes(p.id));
}

/* ---- métricas ---- */
function attendanceRecordsForPlayer(playerId,sessions){
  const ids=new Set(sessions.map(s=>s.id));
  return state.attendance.filter(a=>a.player_id===playerId && ids.has(a.session_id));
}
function calculatePlayerStats(playerId,sessions){
  const recs=attendanceRecordsForPlayer(playerId,sessions);
  const total=recs.length;
  const count=st=>recs.filter(r=>r.status===st).length;
  const present=count("present"), late=count("late"), injured=count("injured"),
        partial=count("partial"), individual=count("individual"),
        justified=count("justified"), unjustified=count("unjustified");
  const participated=present+late+partial+individual;

  const availability=calculateAvailability(recs);
  const globalAttendance= total>0 ? (participated/total*100) : null;
  const completeSessions=calculateCompleteSessions(recs);
  const lateMinutes=calculateLateMinutes(recs);
  const streak=calculateCurrentStreak(playerId,sessions);

  return {
    playerId,total,present,late,injured,partial,individual,justified,unjustified,
    participated,availability,globalAttendance,completeSessions,lateMinutes,streak
  };
}
function calculateAvailability(recs){
  const denom=recs.filter(r=>r.status!=="injured" && r.status!=="justified").length;
  if(denom===0)return null;
  const num=recs.filter(r=>["present","late","partial","individual"].includes(r.status)).length;
  return num/denom*100;
}
function calculateGlobalAttendance(recs){
  if(recs.length===0)return null;
  const num=recs.filter(r=>["present","late","partial","individual"].includes(r.status)).length;
  return num/recs.length*100;
}
function calculateCompleteSessions(recs){
  const denom=recs.filter(r=>r.status!=="injured" && r.status!=="justified").length;
  if(denom===0)return null;
  const num=recs.filter(r=>r.status==="present").length;
  return num/denom*100;
}
function calculateLateMinutes(recs){
  return recs.filter(r=>r.status==="late").reduce((a,r)=>a+(r.late_minutes||0),0);
}
function calculateCurrentStreak(playerId,sessions){
  const sorted=[...sessions].sort((a,b)=>b.date.localeCompare(a.date));
  let streak=0;
  for(const s of sorted){
    const rec=getAttendance(s.id,playerId);
    if(rec && rec.status==="present") streak++;
    else break;
  }
  return streak;
}
function calculateAlerts(players,sessions){
  const alerts=[];
  players.forEach(p=>{
    const stats=calculatePlayerStats(p.id,sessions);
    if(stats.availability!==null && stats.total>=ALERT_THRESHOLDS.minSessionsForAvailabilityAlert && stats.availability<ALERT_THRESHOLDS.minAvailability){
      alerts.push({level:"high",playerId:p.id,text:`${p.name} — disponibilidad del ${Math.round(stats.availability)}%.`});
    }
    if(stats.lateMinutes>ALERT_THRESHOLDS.maxLateMinutes){
      alerts.push({level:"med",playerId:p.id,text:`${p.name} — ${stats.lateMinutes} min de retraso acumulados.`});
    }
    if(stats.partial>ALERT_THRESHOLDS.maxPartialSessions){
      alerts.push({level:"med",playerId:p.id,text:`${p.name} — ${stats.partial} sesiones no acabadas.`});
    }
    if(stats.unjustified>ALERT_THRESHOLDS.maxUnjustified){
      alerts.push({level:"high",playerId:p.id,text:`${p.name} — ${stats.unjustified} ausencias no justificadas.`});
    }
    if(stats.injured>ALERT_THRESHOLDS.maxInjuredSessions){
      alerts.push({level:"low",playerId:p.id,text:`${p.name} — ${stats.injured} sesiones lesionado.`});
    }
  });
  return alerts;
}

/* ============================================================
   6. VALIDACIÓN (import / edición)
   ============================================================ */
function validateState(data){
  const errors=[];
  if(!data || typeof data!=="object") return ["El archivo no tiene un formato reconocible."];
  if(!Array.isArray(data.players)) errors.push("Falta la lista de jugadores (players).");
  if(!Array.isArray(data.roster)) errors.push("Falta la información de plantilla (roster).");
  if(!Array.isArray(data.sessions)) errors.push("Falta la lista de sesiones (sessions).");
  if(!Array.isArray(data.attendance)) errors.push("Falta la lista de asistencias (attendance).");
  if(errors.length) return errors;

  const playerIds=new Set();
  data.players.forEach((p,i)=>{
    if(!p.id) errors.push(`Jugador en la posición ${i+1} no tiene ID.`);
    else if(playerIds.has(p.id)) errors.push(`ID de jugador duplicado: "${p.id}".`);
    else playerIds.add(p.id);
    if(!p.name) errors.push(`El jugador "${p.id||"(sin id)"}" no tiene nombre.`);
    if(typeof p.number!=="number") errors.push(`El jugador "${p.name||p.id}" no tiene un dorsal numérico válido.`);
  });

  const sessionIds=new Set();
  data.sessions.forEach((s,i)=>{
    if(!s.id) errors.push(`Sesión en la posición ${i+1} no tiene ID.`);
    else if(sessionIds.has(s.id)) errors.push(`ID de sesión duplicado: "${s.id}".`);
    else sessionIds.add(s.id);
    if(!isValidISODate(s.date)) errors.push(`La sesión "${s.id||i+1}" tiene una fecha inválida: "${s.date}".`);
    if(!["training","game"].includes(s.type)) errors.push(`La sesión "${s.id||i+1}" tiene un tipo desconocido: "${s.type}".`);
  });

  data.roster.forEach((r,i)=>{
    if(!playerIds.has(r.player_id)) errors.push(`La plantilla hace referencia a un jugador inexistente: "${r.player_id}".`);
    if(!isValidISODate(r.from)) errors.push(`Entrada de plantilla ${i+1} tiene una fecha "from" inválida.`);
    if(r.to!==null && r.to!==undefined && !isValidISODate(r.to)) errors.push(`Entrada de plantilla ${i+1} tiene una fecha "to" inválida.`);
  });

  const seen=new Set();
  data.attendance.forEach((a,i)=>{
    if(!playerIds.has(a.player_id)) errors.push(`Asistencia en la posición ${i+1} hace referencia a un jugador inexistente: "${a.player_id}".`);
    if(!sessionIds.has(a.session_id)) errors.push(`Asistencia en la posición ${i+1} hace referencia a una sesión inexistente: "${a.session_id}".`);
    if(!STATUS[a.status]) errors.push(`Asistencia en la posición ${i+1} tiene un estado desconocido: "${a.status}".`);
    const key=a.session_id+"|"+a.player_id;
    if(seen.has(key)) errors.push(`Asistencia duplicada para el jugador "${a.player_id}" en la sesión "${a.session_id}".`);
    seen.add(key);
    if(a.status==="late" && a.late_minutes!==undefined && (typeof a.late_minutes!=="number" || a.late_minutes<0)){
      errors.push(`Minutos de retraso inválidos (negativos) para "${a.player_id}" en "${a.session_id}".`);
    }
  });

  return errors;
}

/* ============================================================
   7. DATOS DE EJEMPLO
   ============================================================ */
function generateSeedData(){
  const rnd=mulberry32(42);
  const names=[
    ["Pablo García",8],["Carlos López",11],["Juan Pérez",15],["Sergio Ruiz",21],
    ["Álvaro Martín",5],["Diego Fernández",7],["Mario Sánchez",9],["Iker Romero",4],
    ["Adrián Torres",12],["Hugo Navarro",23],["Marcos Jiménez",6],["Bruno Ortega",14],
    ["Nico Alonso",10],["Rubén Castro",17]
  ];
  const s=emptyState();
  const usedIds=new Set();
  names.forEach(([name,number])=>{
    const id=uid("player",usedIds); usedIds.add(id);
    s.players.push({id,name,number});
    s.roster.push({player_id:id,from:"2026-06-01",to:null});
  });
  // jugador dado de baja, para probar histórico conservado
  const bajaId=uid("player",usedIds); usedIds.add(bajaId);
  s.players.push({id:bajaId,name:"Iván Molina",number:19});
  s.roster.push({player_id:bajaId,from:"2026-06-01",to:"2026-07-15"});

  // sesiones: lun/mié/vie entreno, sáb partido, desde 1 jun hasta 28 ago 2026
  const sessUsed=new Set();
  let d=parseISO("2026-06-01");
  const end=parseISO("2026-08-28");
  const comments=["Molestias en el tobillo.","Llegó tarde por trabajo.","Trabajo de recuperación.",
    "Se retiró por molestias.","Examen universitario.","Tráfico.","Cita médica.","Sobrecarga muscular."];
  while(d<=end){
    const dow=d.getDay(); // 0 dom .. 6 sab
    let type=null,name=null;
    if(dow===1||dow===3||dow===5){type="training";name="Entrenamiento";}
    else if(dow===6 && rnd()<0.6){type="game";name="Partido";}
    if(type && rnd()>0.06){ // pequeño % de sesiones canceladas/sin registrar
      const iso=d.getFullYear()+"-"+pad(d.getMonth()+1,2)+"-"+pad(d.getDate(),2);
      const id=uid("session",sessUsed); sessUsed.add(id);
      const session={id,date:iso,type,name,time:type==="game"?"11:00":"19:00",notes:""};
      s.sessions.push(session);
      getActivePlayersOnLocal(s,iso).forEach(p=>{
        const roll=rnd();
        let rec={session_id:id,player_id:p.id,status:"present"};
        if(roll<0.75){ rec.status="present"; }
        else if(roll<0.85){ rec.status="late"; rec.late_minutes=[5,10,15,20,30][Math.floor(rnd()*5)]; if(rnd()<0.3)rec.comment=comments[Math.floor(rnd()*comments.length)]; }
        else if(roll<0.90){ rec.status="injured"; if(rnd()<0.5)rec.comment=comments[Math.floor(rnd()*comments.length)]; }
        else if(roll<0.94){ rec.status="partial"; if(rnd()<0.4)rec.comment=comments[Math.floor(rnd()*comments.length)]; }
        else if(roll<0.97){ rec.status="individual"; }
        else if(roll<0.985){ rec.status="justified"; if(rnd()<0.6)rec.comment=comments[Math.floor(rnd()*comments.length)]; }
        else { rec.status="unjustified"; }
        s.attendance.push(rec);
      });
    }
    d.setDate(d.getDate()+1);
  }
  return s;
}
function getActivePlayersOnLocal(s,iso){
  return s.players.filter(p=>s.roster.some(r=>r.player_id===p.id && r.from<=iso && (r.to===null||r.to>=iso)));
}

function init(){
  const loaded=loadLocal();
  if(loaded){ state=loaded; }
  else{ state=emptyState(); saveLocal(); }
  if(!state.players) state=emptyState();
  markExported(); // al cargar consideramos "guardado" localmente; el export pendiente se detecta por cambios posteriores
  // seleccionar sesión más reciente por defecto
  const sorted=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  ui.currentSessionId = sorted.length? sorted[0].id : null;
  render();
}

function renderAsistencia(){
  const sorted=[...state.sessions].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));

  const picker = `
    <div class="session-picker">
      <button class="chip-btn primary" data-act="new-session">+ Nueva sesión</button>
      ${sorted.slice(-30).reverse().map(s=>`

          <div class="d1">${s.type==='game'?'Partido':'Entreno'}</div>
          <div class="d2">${fmtDateShort(s.date)}</div>
        </button>
      `).join("")}
    </div>`;

  if(state.players.length===0){
    return `
      <div class="empty-state">
        <div class="disp">Empieza creando tu plantilla</div>

        <button class="btn btn-accent" data-act="open-roster">+ Añadir jugadores</button>
      </div>`;
  }

  if(!session){
    return picker + `
      <div class="empty-state">
        <div class="disp">Todavía no hay sesiones</div>
        <p>Crea la primera sesión de entrenamiento o partido para empezar a registrar asistencia.</p>
        <button class="btn btn-accent" data-act="new-session">+ Crear sesión</button>
      </div>`;
  }

  const activePlayers = getActivePlayersOn(session.date).sort((a,b)=>a.number-b.number);
  const rows = activePlayers.map(p=>{
    const rec = getAttendance(session.id,p.id) || {status:"present"};
    const st = STATUS[rec.status];
    let detail="";
    if(rec.status==="late") detail = `${rec.late_minutes||0} min`;
    return `
    <div class="player-row" data-status="${rec.status}" data-act="open-status" data-player="${p.id}">
      <div class="jersey">${p.number}</div>
      <div class="player-info">
        <div class="player-name">${escapeHtml(p.name)}${rec.comment?`<span class="cmt">✎</span>`:""}</div>
      </div>
      <div class="status-chip" data-status="${rec.status}">
        <span>${st.icon}</span><span>${st.short}</span>
        ${detail?`<span class="status-detail">· ${detail}</span>`:""}
      </div>
    </div>`;
  }).join("");

  return picker + `
    <div class="session-header">
      <div class="session-header-top">
        <div>
          <div class="disp session-title">${fmtDateLong(session.date)}${session.time? ' · '+session.time:''}</div>
          <div class="session-sub">${escapeHtml(session.name)}</div>
        </div>
        <span class="session-type-badge ${session.type==='game'?'type-game':'type-training'}">${session.type==='game'?'Partido':'Entrenamiento'}</span>
      </div>
      <div class="session-count">${activePlayers.length} jugador${activePlayers.length===1?'':'es'}</div>
      ${session.notes? `<div class="session-notes">${escapeHtml(session.notes)}</div>`:""}
      <div class="session-actions">
        <button class="btn btn-navy btn-sm" data-act="mark-all-present">✓ Todos asistentes</button>
        <button class="btn btn-ghost btn-sm" data-act="edit-session" data-id="${session.id}">✎ Editar sesión</button>
        <button class="btn btn-ghost btn-sm" data-act="duplicate-session" data-id="${session.id}">⧉ Duplicar</button>
      </div>
    </div>
    <div class="player-list">
      ${rows || `<div class="empty-state"><p>No hay jugadores activos en la plantilla para esta fecha.</p></div>`}
    </div>
  `;
}

  return filterPlayers(state.players, ui.dash.playerIds);

function renderDashboard(){
  const sessions=getDashSessions();
  const players= ui.dash.playerIds.length? state.players.filter(p=>ui.dash.playerIds.includes(p.id)) : state.players;
  const statsByPlayer={};
  players.forEach(p=> statsByPlayer[p.id]=calculatePlayerStats(p.id,sessions));

  const totalSessions=sessions.length;
  const avgAvail = avg(players.map(p=>statsByPlayer[p.id].availability).filter(v=>v!==null));
  const avgComplete = avg(players.map(p=>statsByPlayer[p.id].completeSessions).filter(v=>v!==null));
  const totalLate = players.reduce((a,p)=>a+statsByPlayer[p.id].late,0);
  const totalLateMin = players.reduce((a,p)=>a+statsByPlayer[p.id].lateMinutes,0);
  const totalUnjustified = players.reduce((a,p)=>a+statsByPlayer[p.id].unjustified,0);
  const totalInjured = players.reduce((a,p)=>a+statsByPlayer[p.id].injured,0);
  const totalPartial = players.reduce((a,p)=>a+statsByPlayer[p.id].partial,0);
  const totalIndividual = players.reduce((a,p)=>a+statsByPlayer[p.id].individual,0);
  const totalJustified = players.reduce((a,p)=>a+statsByPlayer[p.id].justified,0);

  const alerts=calculateAlerts(players,sessions);
  const detail = ui.dash.detailPlayerId ? players.find(p=>p.id===ui.dash.detailPlayerId) : null;

  return `
    ${renderFilterBar()}
    <div class="section-title disp">Resumen</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="val">${fmtPct(avgAvail)}</div><div class="lbl">Disponibilidad media</div></div>
      <div class="kpi-card"><div class="val">${fmtPct(avgComplete)}</div><div class="lbl">Sesiones completas</div></div>
      <div class="kpi-card secondary"><div class="val">${totalLate}</div><div class="lbl">Llegadas tarde</div></div>
      <div class="kpi-card secondary"><div class="val">${totalLateMin}</div><div class="lbl">Min. de retraso</div></div>
      <div class="kpi-card secondary"><div class="val">${totalUnjustified}</div><div class="lbl">Ausencias no justif.</div></div>
      <div class="kpi-card secondary"><div class="val">${totalSessions}</div><div class="lbl">Sesiones en el filtro</div></div>
      <div class="kpi-card secondary"><div class="val">${totalInjured}</div><div class="lbl">Lesiones</div></div>
      <div class="kpi-card secondary"><div class="val">${totalPartial}</div><div class="lbl">No acabadas</div></div>
      <div class="kpi-card secondary"><div class="val">${totalIndividual}</div><div class="lbl">Trabajo individual</div></div>
      <div class="kpi-card secondary"><div class="val">${totalJustified}</div><div class="lbl">Ausencias justif.</div></div>
    </div>

    <div class="section-title disp">Jugadores</div>
    ${renderStatsTable(players,statsByPlayer)}

    <div class="section-title disp">Atención</div>
    <div class="alerts-block">${renderAlerts(alerts)}</div>

    <div class="section-title disp">Evolución de la disponibilidad</div>
    ${renderEvolutionChart(players,sessions)}

    ${detail? renderDetailPanel(detail,sessions,statsByPlayer[detail.id]) : ""}
  `;
}

function avg(arr){ if(!arr.length)return null; return arr.reduce((a,b)=>a+b,0)/arr.length; }
function fmtPct(v){ return v===null||v===undefined ? "—" : Math.round(v)+"%"; }

function renderStatsTable(players,statsByPlayer){
  const cols=[
    {key:"availability",label:"Disponib."},
    {key:"completeSessions",label:"Completa"},
    {key:"late",label:"Tarde"},
    {key:"lateMinutes",label:"Min. tarde"},
    {key:"injured",label:"Lesionado"},
    {key:"partial",label:"No acabó"},
    {key:"individual",label:"Individual"},
    {key:"justified",label:"Justif."},
    {key:"unjustified",label:"No justif."}
  ];
  const rows=[...players].sort((a,b)=>{
    const sa=statsByPlayer[a.id][ui.dash.sort.col], sb=statsByPlayer[b.id][ui.dash.sort.col];
    const va = sa===null?-1:sa, vb = sb===null?-1:sb;
    return ui.dash.sort.dir==='asc'? va-vb : vb-va;
  });
  const th=(c)=>`<th class="${ui.dash.sort.col===c.key?'active':''}" data-act="sort-col" data-col="${c.key}">${c.label}${ui.dash.sort.col===c.key?(ui.dash.sort.dir==='asc'?' ▲':' ▼'):''}</th>`;

  const tableRows=rows.map(p=>{
    const s=statsByPlayer[p.id];
    return `<tr data-act="show-detail" data-id="${p.id}">
      <td>#${p.number} ${escapeHtml(p.name)}</td>
      <td>${fmtPct(s.availability)}</td>
      <td>${fmtPct(s.completeSessions)}</td>
      <td>${s.late}</td>
      <td>${s.lateMinutes}</td>
      <td>${s.injured}</td>
      <td>${s.partial}</td>
      <td>${s.individual}</td>
      <td>${s.justified}</td>
      <td>${s.unjustified}</td>
    </tr>`;
  }).join("");

  const cardRows=rows.map(p=>{
    const s=statsByPlayer[p.id];
    return `<div class="stat-card" data-act="show-detail" data-id="${p.id}">
      <div class="stat-card-top">
        <div class="stat-card-name">#${p.number} ${escapeHtml(p.name)}</div>
        <div class="stat-card-avail">${fmtPct(s.availability)}</div>
      </div>
      <div class="stat-card-grid">
        <div><b>${fmtPct(s.completeSessions)}</b>Completa</div>
        <div><b>${s.late}</b>Tarde</div>
        <div><b>${s.lateMinutes}</b>Min. tarde</div>
        <div><b>${s.unjustified}</b>No justif.</div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="table-wrap"><div class="table-scroll">
    <table class="stats"><thead><tr>
      <th data-act="sort-col" data-col="name">Jugador</th>
      ${cols.map(th).join("")}
    </tr></thead>
    <tbody>${tableRows || `<tr><td colspan="10" style="text-align:center;color:var(--ink-soft);padding:20px;">Sin datos para este filtro.</td></tr>`}</tbody>
    </table></div></div>

function renderEvolutionChart(players,sessions){
  const byWeek={};
  const weekOrder=[];
  [...sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{
    const key=s.date.slice(0,4)+"-W"+pad(isoWeek(s.date),2);
    if(!byWeek[key]){byWeek[key]=[]; weekOrder.push(key);}
    byWeek[key].push(s);
  });
  if(weekOrder.length<1){
    return `<div class="chart-card"><p style="color:var(--ink-soft);font-size:14px;">No hay sesiones suficientes en el filtro para mostrar una evolución.</p></div>`;
  }
  const palette=["#E8590C","#16324A","#2F9E44","#9C6ADE","#D9A404","#5F7A9A"];
  const series=players.slice(0,6).map((p,i)=>{
    const pts=weekOrder.map(wk=>{
      const sess=byWeek[wk];
      const stats=calculatePlayerStats(p.id,sess);
      return stats.availability;
    });
    return {player:p,color:palette[i%palette.length],pts};
  });

  const W=Math.max(320, weekOrder.length*46), H=220, padL=34,padR=10,padT=10,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const x=(i)=> padL + (weekOrder.length<=1? plotW/2 : i/(weekOrder.length-1)*plotW);
  const y=(v)=> padT + (100-v)/100*plotH;

  let svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="xMinYMid meet">`;
  [0,25,50,75,100].forEach(v=>{
    svg+=`<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    svg+=`<text x="4" y="${y(v)+4}" font-size="9" fill="var(--ink-faint)">${v}%</text>`;
  });
  weekOrder.forEach((wk,i)=>{
    if(i%Math.ceil(weekOrder.length/8||1)===0){
      svg+=`<text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--ink-faint)" text-anchor="middle">${wk.split("-W")[1]}</text>`;
    }
  });
  series.forEach(sr=>{
    let path="", started=false;
    sr.pts.forEach((v,i)=>{
      if(v===null){started=false; return;}
      path += (started?"L":"M") + x(i)+","+y(v)+" ";
      started=true;
    });
    svg+=`<path d="${path}" fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    sr.pts.forEach((v,i)=>{ if(v!==null) svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${sr.color}"/>`; });
  });
  svg+=`</svg>`;

  return `
  <div class="chart-card">
    <div class="chart-legend">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${escapeHtml(sr.player.name)}</span>`).join("")}</div>
    <div style="overflow-x:auto;">${svg}</div>
    ${players.length>6?`<p style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Mostrando los primeros 6 jugadores seleccionados.</p>`:""}
  </div>`;
}

function renderOverlay(){
  const host=document.getElementById("overlays");
  if(!ui.overlay){
    const existing=host.querySelector(".overlay");
    if(existing) existing.remove();
    return;
  }
  let bg=host.querySelector(".overlay");
  if(bg){
    // El overlay ya está abierto: solo actualizamos su contenido,
    // sin recrear el nodo (evita el parpadeo / reanimación al elegir un estado).
    const sheet=bg.querySelector(".sheet");
    const activeField=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.field : null;
    sheet.innerHTML = overlayContent();
    if(activeField){
      const toFocus=sheet.querySelector(`[data-field="${activeField}"]`);
      if(toFocus) toFocus.focus();
    }
    return;
  }
  bg=document.createElement("div");
  bg.className="overlay";
  bg.dataset.act="overlay-bg";
  bg.innerHTML = `<div class="sheet" data-stop="1">${overlayContent()}</div>`;
  host.appendChild(bg);
  attachOverlayListeners();
  const firstInput=bg.querySelector("input,select,textarea,button.status-opt");
  if(firstInput) setTimeout(()=>firstInput.focus && firstInput.focus(),50);
}

function overlayContent(){
  const o=ui.overlay;
  if(!o) return "";
  switch(o.type){
    case "status": return renderStatusSheet(o);
    case "new-session": case "edit-session": return renderSessionSheet(o);
    case "duplicate-date": return renderDuplicateDateSheet(o);
    case "roster": return renderRosterSheet(o);
    case "reactivate-date": return renderReactivateDateSheet(o);
    case "add-player": case "edit-player": return renderPlayerFormSheet(o);
    case "sessions-mgmt": return renderSessionsMgmtSheet(o);
    case "player-filter": return renderPlayerFilterSheet(o);
    case "import": return renderImportSheet(o);
    case "confirm": return renderConfirmSheet(o);
    default: return "";
  }
}

/* ============================================================
   14. EVENT HANDLING
   ============================================================ */
function attachGlobalListeners(){
  document.body.onclick = onGlobalClick;
  document.body.onchange = onGlobalChange;
  document.body.oninput = onGlobalInput;
}
function onGlobalInput(e){
  // Captura cada pulsación de texto/número/fecha directamente en el borrador
  // del overlay, sin volver a pintar nada: evita el "salto" hasta perder el foco.
  const t=e.target;
  if(!t.dataset) return;
  const field=t.dataset.field;
  if(field && ui.overlay && ui.overlay.draft){
    ui.overlay.draft[field]=t.value;
  }
}
function attachOverlayListeners(){
  const bg=document.querySelector(".overlay");
  if(!bg) return;
  bg.addEventListener("click",(e)=>{ if(e.target===bg) closeOverlay(); });
}

function onGlobalClick(e){
  const t=e.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act;
  switch(act){
    case "tab": ui.tab=t.dataset.tab; ui.dash.detailPlayerId=null; render(); break;
    case "pick-session": ui.currentSessionId=t.dataset.id; render(); break;
    case "new-session": ui.overlay={type:"new-session"}; render(); break;
    case "edit-session": {
      const s=state.sessions.find(x=>x.id===t.dataset.id);
      ui.overlay={type:"edit-session",id:t.dataset.id,draft:{...s}}; render(); break;
    }
    case "duplicate-session": {
      const src=state.sessions.find(x=>x.id===t.dataset.id);
      if(src){
        ui.overlay={type:"duplicate-date",id:src.id,draft:{date:addDaysISO(src.date,7)}};
        render();
      }
      break;
    }
    case "confirm-duplicate-session": {
      const o=ui.overlay;
      if(!isValidISODate(o.draft.date)){ o.error="La fecha no es válida."; renderOverlay(); return; }
      const dup=duplicateSession(o.id,o.draft.date);
      if(dup){ ui.currentSessionId=dup.id; ui.overlay=null; ui.tab="asistencia"; saveLocal(); showToast("Sesión duplicada. Todos marcados como asistentes."); render(); }
      break;
    }
    case "mark-all-present": {
      if(!ui.currentSessionId) break;
      markAllPresent(ui.currentSessionId); saveLocal(); showToast("Todos marcados como asistentes."); break;
    }
    case "open-status": {
      ui.overlay={type:"status",sessionId:ui.currentSessionId,playerId:t.dataset.player}; render(); break;
    }
    case "pick-status": {
      ui.overlay.draft.status=t.dataset.status; renderOverlay(); break;
    }
    case "save-status": {
      const o=ui.overlay, d=o.draft;
      const patch={status:d.status};
      if(d.status==='late'){
        const mins=parseInt(d.late_minutes,10);
        if(isNaN(mins)||mins<0){ o.error="Los minutos de retraso deben ser un número igual o mayor que 0."; renderOverlay(); return; }
        patch.late_minutes=mins;
      }
      if(d.comment && d.comment.trim()) patch.comment=d.comment.trim();
      setAttendanceStatus(o.sessionId,o.playerId,patch);
      ui.overlay=null; saveLocal(); render();
      break;
    }
    case "open-roster": ui.overlay={type:"roster"}; render(); break;
    case "add-player": ui.overlay={type:"add-player",draft:{name:"",number:"",from:earliestActiveRosterFrom()}}; render(); break;
    case "edit-player": {
      const p=state.players.find(x=>x.id===t.dataset.id);
      const entry=currentRosterEntry(t.dataset.id);
      ui.overlay={type:"edit-player",id:t.dataset.id,draft:{...p,number:String(p.number),from:entry?entry.from:""}}; render(); break;
    }
    case "save-player": {
      const o=ui.overlay, d=o.draft;
      const name=(d.name||"").trim();
      const number=parseInt(d.number,10);
      if(!name){ o.error="El jugador necesita un nombre."; renderOverlay(); return; }
      if(isNaN(number)||number<0){ o.error="El dorsal debe ser un número válido."; renderOverlay(); return; }
      const editingExisting=!!t.dataset.id;
      const needsFromCheck = !editingExisting || !!d.from;
      if(needsFromCheck && !isValidISODate(d.from)){ o.error="La fecha de alta no es válida."; renderOverlay(); return; }
      if(editingExisting){
        const p=state.players.find(x=>x.id===t.dataset.id);
        p.name=name; p.number=number;
        if(d.from){
          const entry=currentRosterEntry(t.dataset.id);
          if(entry) entry.from=d.from;
        }
        showToast("Jugador actualizado.");
      } else {
        const id=uid("player",new Set(state.players.map(p=>p.id)));
        state.players.push({id,name,number});
        state.roster.push({player_id:id,from:d.from,to:null});
        showToast("Jugador añadido.");
      }
      ui.overlay={type:"roster"}; saveLocal(); render();
      break;
    }
    case "deactivate-player": {
      ui.overlay={type:"confirm",title:"Dar de baja",message:"El jugador no aparecerá en nuevas sesiones. Su histórico se conservará.",confirmLabel:"Dar de baja",
        onConfirm:()=>{
          const entry=currentRosterEntry(t.dataset.id);
          if(entry) entry.to=todayISO();
          saveLocal(); ui.overlay={type:"roster"}; render();
          showToast("Jugador dado de baja.");
        }};
      render(); break;
    }
    case "reactivate-player": {
      ui.overlay={type:"reactivate-date",id:t.dataset.id,draft:{from:todayISO()}};
      render(); break;
    }
    case "confirm-reactivate-player": {
      const o=ui.overlay;
      if(!isValidISODate(o.draft.from)){ o.error="La fecha no es válida."; renderOverlay(); return; }
      const p=state.players.find(x=>x.id===o.id);
      state.roster.push({player_id:o.id,from:o.draft.from,to:null});
      saveLocal(); ui.overlay={type:"roster"}; render(); showToast(`${p.name} reactivado.`);
      break;
    }
    case "open-sessions": ui.overlay={type:"sessions-mgmt"}; render(); break;
    case "pick-session-close": ui.currentSessionId=t.dataset.id; ui.tab="asistencia"; ui.overlay=null; render(); break;
    case "delete-session-confirm": {
      const s=state.sessions.find(x=>x.id===t.dataset.id);
      ui.overlay={type:"confirm",title:"Eliminar sesión",
        message:`Se eliminará la sesión del ${fmtDateLong(s.date)} y todos sus registros de asistencia. Esta acción no se puede deshacer.`,
        confirmLabel:"Eliminar",
        onConfirm:()=>{
          deleteSession(s.id);
          if(ui.currentSessionId===s.id){
            const sorted=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));
            ui.currentSessionId=sorted.length?sorted[0].id:null;
          }
          saveLocal(); ui.overlay={type:"sessions-mgmt"}; render(); showToast("Sesión eliminada.");
        }};
      render(); break;
    }
    case "save-session": {
      const o=ui.overlay, d=o.draft;
      if(!isValidISODate(d.date)){ o.error="La fecha no es válida."; renderOverlay(); return; }
      if(!["training","game"].includes(d.type)){ o.error="Selecciona un tipo de sesión."; renderOverlay(); return; }
      if(o.type==="edit-session"){
        const s=state.sessions.find(x=>x.id===o.id);
        Object.assign(s,{date:d.date,type:d.type,name:d.name||(d.type==='game'?'Partido':'Entrenamiento'),time:d.time||null,notes:d.notes||""});
        showToast("Sesión actualizada.");
      } else {
        const s=createSession(d);
        ui.currentSessionId=s.id;
        showToast("Sesión creada. Todos marcados como asistentes.");
      }
      ui.overlay=null; saveLocal(); render();
      break;
    }
    case "open-player-filter": ui.overlay={type:"player-filter",draftIds:[...ui.dash.playerIds]}; render(); break;
    case "clear-player-filter": ui.dash.playerIds=[]; ui.overlay=null; render(); break;
    case "apply-player-filter": ui.dash.playerIds=[...ui.overlay.draftIds]; ui.overlay=null; render(); break;
    case "sort-col": {
      const col=t.dataset.col;
      if(ui.dash.sort.col===col) ui.dash.sort.dir = ui.dash.sort.dir==='asc'?'desc':'asc';
      else ui.dash.sort={col,dir:'desc'};
      render(); break;
    }
    case "show-detail": ui.dash.detailPlayerId=t.dataset.id; render();
      setTimeout(()=>{const el=document.querySelector(".detail-panel"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});},50);
      break;
    case "close-detail": ui.dash.detailPlayerId=null; render(); break;
    case "export": doExport(); break;
    case "reset-data": {
      ui.overlay={type:"confirm",title:"Vaciar todos los datos",
        message:"Se eliminarán todos los jugadores, sesiones y asistencias (incluidos los datos de ejemplo). Esta acción no se puede deshacer. Si quieres conservar una copia, exporta el YAML antes de continuar.",
        confirmLabel:"Vaciar datos",
        onConfirm:()=>{
          state=emptyState();
          saveLocal(); markExported();
          ui.currentSessionId=null; ui.dash.playerIds=[]; ui.dash.detailPlayerId=null;
          ui.overlay=null; ui.tab="asistencia"; render();
          showToast("Datos eliminados. Empieza añadiendo tu plantilla.");
        }};
      render(); break;
    }
    case "import": ui.overlay={type:"import"}; render(); break;
    case "do-import": doImport(); break;
    case "close-overlay": closeOverlay(); break;
    case "confirm-yes": { const cb=ui.overlay && ui.overlay.onConfirm; if(cb) cb(); break; }
    case "overlay-bg": break;
  }
}

function closeOverlay(){ ui.overlay=null; render(); }

function onGlobalChange(e){
  const t=e.target;
  if(!t.dataset) return;
  const act=t.dataset.act, field=t.dataset.field;
  if(field && ui.overlay && ui.overlay.draft){
    ui.overlay.draft[field]=t.value;
    return;
  }
  switch(act){
    case "dash-date-mode": ui.dash.dateMode=t.value; render(); break;
    case "dash-date-from": ui.dash.dateFrom=t.value; render(); break;
    case "dash-date-to": ui.dash.dateTo=t.value; render(); break;
    case "dash-type": ui.dash.type=t.value; render(); break;
    case "toggle-player-filter": {
      const id=t.dataset.id;
      const set=new Set(ui.overlay.draftIds);
      if(t.checked) set.add(id); else set.delete(id);
      ui.overlay.draftIds=[...set];
      break;
    }
  }
}

/* ============================================================
   15. IMPORT / EXPORT YAML
   ============================================================ */
function toPlainAttendance(a){
  const o={session_id:a.session_id,player_id:a.player_id,status:a.status};
  if(a.status==='late' && a.late_minutes!==undefined) o.late_minutes=a.late_minutes;
  if(a.comment) o.comment=a.comment;
  return o;
}
function doExport(){
  const exportObj={
    version: state.version||1,
    season: state.season,
    players: state.players.map(p=>({id:p.id,name:p.name,number:p.number})),
    roster: state.roster.map(r=>({player_id:r.player_id,from:r.from,to:r.to})),
    sessions: [...state.sessions].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({
      id:s.id,date:s.date,type:s.type,name:s.name,
      ...(s.time?{time:s.time}:{}),
      ...(s.notes?{notes:s.notes}:{})
    })),
    attendance: state.attendance.map(toPlainAttendance)
  };
  let yamlText;
  try{
    yamlText = jsyaml.dump(exportObj,{lineWidth:100,noRefs:true});
  }catch(e){
    showToast("Error al generar el YAML."); return;
  }
  const blob=new Blob([yamlText],{type:"text/yaml"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const now=new Date();
  const stamp=now.getFullYear()+"-"+pad(now.getMonth()+1,2)+"-"+pad(now.getDate(),2)+"_"+pad(now.getHours(),2)+pad(now.getMinutes(),2);
  a.href=url; a.download="baloncesto_asistencia_"+stamp+".yaml";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  markExported();
  render();
  showToast("YAML exportado.");
}

function doImport(){
  const input=document.getElementById("import-file-input");
  if(!input || !input.files || !input.files[0]){
    ui.overlay.error="Selecciona primero un archivo .yaml"; render(); return;
  }
  const file=input.files[0];
  const reader=new FileReader();
  reader.onload=function(ev){
    let data;
    try{ data=jsyaml.load(ev.target.result); }
    catch(e){ ui.overlay.error="El archivo no es un YAML válido:\n"+e.message; render(); return; }
    const errors=validateState(data);
    if(errors.length){
      ui.overlay.error="No se puede importar este archivo:\n"+errors.slice(0,8).map(e=>"• "+e).join("\n")+(errors.length>8?`\n… y ${errors.length-8} más.`:"");
      render(); return;
    }
    ui.overlay={type:"confirm",title:"Reemplazar datos",
      message:"Se reemplazarán todos los datos actuales por el contenido del archivo importado. Esta acción no se puede deshacer.",
      confirmLabel:"Reemplazar",
      onConfirm:()=>{
        state={
          version: data.version||1,
          season: data.season||{name:seasonNameFromDate(todayISO())},
          players: data.players.map(p=>({id:p.id,name:p.name,number:p.number})),
          roster: data.roster.map(r=>({player_id:r.player_id,from:r.from,to:(r.to===undefined?null:r.to)})),
          sessions: data.sessions.map(s=>({id:s.id,date:s.date,type:s.type,name:s.name,time:s.time||null,notes:s.notes||""})),
          attendance: data.attendance.map(a=>({
            session_id:a.session_id,player_id:a.player_id,status:a.status,
            ...(a.late_minutes!==undefined?{late_minutes:a.late_minutes}:{}),
            ...(a.comment?{comment:a.comment}:{})
          }))
        };
        saveLocal(); markExported();
        const sorted=[...state.sessions].sort((a,b)=>b.date.localeCompare(a.date));
        ui.currentSessionId=sorted.length?sorted[0].id:null;
        ui.dash.playerIds=[]; ui.dash.detailPlayerId=null;
        ui.overlay=null; render();
        showToast("Datos importados correctamente.");
      }};
    render();
  };
  reader.readAsText(file);
}

/* ============================================================
   16. ARRANQUE
   ============================================================ */
document.addEventListener("DOMContentLoaded",init);
if(document.readyState!=="loading") init();

})();
</script>
