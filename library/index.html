<style>
/* ====================== TOKENS ====================== */
:root{
  --bg:#11161a;
  --surface-1:#171f24;
  --surface-2:#202b32;
  --surface-3:#29363f;
  --border:#33434d;
  --border-soft:#263139;
  --court:#2f8f6f;
  --court-dim:#257259;
  --court-glow:rgba(47,143,111,.35);
  --court-bg:rgba(47,143,111,.14);
  --orange:#e8722f;
  --orange-dim:#c85c1f;
  --orange-bg:rgba(232,114,47,.14);
  --gold:#c9a227;
  --gold-bg:rgba(201,162,39,.14);
  --purple:#9464c9;
  --purple-bg:rgba(148,100,201,.14);
  --blue:#4f7fd1;
  --blue-bg:rgba(79,127,209,.14);
  --success:#35b87a;
  --success-bg:rgba(53,184,122,.14);
  --danger:#e0605a;
  --danger-bg:rgba(224,96,90,.14);
  --text-1:#f1f4f1;
  --text-2:#a8b3ad;
  --text-3:#6c7a74;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --font-display:'Oswald',sans-serif;
  --font-body:'Manrope',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text-1);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overscroll-behavior-y:none;
  padding-bottom:calc(84px + var(--safe-bottom));
}
::selection{background:var(--court);color:#06120d;}
button{font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform .08s ease;border:none;background:none;color:inherit;}
button:active{transform:scale(.96);}
/* Fallback: cualquier icono SVG sin regla de tamaño más específica cae aquí (los SVG sin
   width/height propios colapsan a 0 o a 300x150 según el contexto flex si no se fija esto). */
svg{width:16px;height:16px;flex:none;display:block;}
input,textarea,select{font-family:inherit;color:var(--text-1);}
input,textarea,select{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;width:100%;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--court);}
textarea{resize:vertical;min-height:64px;line-height:1.4;}
label{display:block;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.02em;}
a{color:var(--court);}
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);}

/* ====================== HEADER / TABS ====================== */

.brand h1{font-size:18px;font-weight:700;color:var(--text-1);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand h1 span{color:var(--court);}
.header-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;}
.icon-btn:hover{border-color:var(--text-3);}
.icon-btn svg{width:18px;height:18px;}

nav.tabs{max-width:1180px;margin:10px auto 0;display:flex;gap:6px;background:var(--surface-1);border:1px solid var(--border-soft);border-radius:999px;padding:4px;}
nav.tabs button{flex:1;padding:9px 8px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:6px;}
nav.tabs button.active{background:var(--court);color:#06140f;}
nav.tabs button svg{width:15px;height:15px;flex:none;}

main{max-width:1180px;margin:0 auto;padding:16px;}

/* ====================== BUTTONS ====================== */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);padding:10px 18px;font-size:14px;font-weight:700;transition:background .15s,border-color .15s;}
.btn:hover{border-color:var(--text-3);}
.btn-ghost{background:transparent;}
.btn-court{background:var(--court);border-color:var(--court);color:#06140f;}
.btn-court:hover{background:var(--court-dim);border-color:var(--court-dim);}
.btn-orange{background:var(--orange);border-color:var(--orange);color:#1a0d02;}
.btn-orange:hover{background:var(--orange-dim);border-color:var(--orange-dim);}
.btn-danger-outline{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:7px 13px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.45;pointer-events:none;}
.fab{position:fixed;right:18px;bottom:calc(88px + var(--safe-bottom));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--court);color:#06140f;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px var(--court-glow);}
.fab svg{width:24px;height:24px;}

/* ====================== BOTTOM NAV (mobile) ====================== */
nav.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(23,31,36,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border-soft);padding:8px 10px calc(8px + var(--safe-bottom));display:none;}
nav.bottombar .row{max-width:1180px;margin:0 auto;display:flex;gap:4px;}
nav.bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--text-3);font-size:10.5px;font-weight:700;}
nav.bottombar button.active{color:var(--court);}
nav.bottombar button svg{width:20px;height:20px;}
@media (max-width:720px){
  nav.tabs{display:none;}
  nav.bottombar{display:block;}
}

/* ====================== CARDS / LISTS ====================== */
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px;flex-wrap:wrap;}
.section-head h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);}
.card{background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

.drill-card{background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s;}
.drill-card:hover{border-color:var(--border);}
.drill-thumb{width:100%;aspect-ratio:16/9;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.drill-thumb img{width:100%;height:100%;object-fit:cover;}
.drill-thumb svg{width:34px;height:34px;color:var(--text-3);}
.drill-fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(17,22,26,.65);display:flex;align-items:center;justify-content:center;}
.drill-fav svg{width:15px;height:15px;}
.drill-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.drill-name{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.01em;}
.drill-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-2);}
.drill-meta .mono{color:var(--text-2);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
.badge svg{width:11px;height:11px;}
.btn-sm svg{width:14px;height:14px;}
.tag{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border-soft);}
.tag-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.tag-suggestion:active{background:var(--court-bg);color:var(--court);border-color:var(--court);}

.empty{padding:48px 20px;text-align:center;color:var(--text-2);}
.empty svg{width:52px;height:52px;color:var(--text-3);margin-bottom:14px;}
.empty h3{color:var(--text-1);font-size:17px;margin-bottom:6px;}
.empty p{font-size:13.5px;line-height:1.5;max-width:340px;margin:0 auto 16px;}

/* ====================== FILTER BAR ====================== */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.search-box{position:relative;flex:1;min-width:180px;}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-3);}
.search-box input{padding-left:34px;}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;}
.chip svg{width:12px;height:12px;flex:none;}
.chip.active{background:var(--court-bg);border-color:var(--court);color:var(--court);}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}

/* ====================== MODAL / SHEET ====================== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,9,11,.6);display:flex;align-items:flex-end;justify-content:center;}
@media (min-width:720px){.overlay{align-items:center;}}
.sheet{background:var(--surface-1);border:1px solid var(--border-soft);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + var(--safe-bottom));}
@media (min-width:720px){.sheet{border-radius:20px;max-height:88vh;}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:0;background:var(--surface-1);padding-top:2px;}
.sheet-head h2{font-size:19px;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;}
.sheet-close svg{width:16px;height:16px;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stepper{display:flex;align-items:stretch;}
.stepper-btn{flex:none;width:42px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--text-1);touch-action:manipulation;}
.stepper-btn svg{width:16px;height:16px;}
.stepper-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);border-right:none;}
.stepper-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:none;}
.stepper-btn:active{background:var(--surface-3);}
.stepper .stepper-input{border-radius:0;text-align:center;width:auto;flex:1;min-width:0;-moz-appearance:textfield;}
.stepper .stepper-input::-webkit-outer-spin-button,.stepper .stepper-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.hint{font-size:11.5px;color:var(--text-3);margin-top:5px;}
.pill-select{display:flex;flex-wrap:wrap;gap:6px;}
.pill-select button{padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2);}
.pill-select button.active{color:#fff;border-color:transparent;}
.sheet-footer{display:flex;gap:10px;margin-top:18px;}
.img-upload{border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:16px;text-align:center;background:var(--surface-2);position:relative;overflow:hidden;}
.img-upload img{max-width:100%;max-height:180px;border-radius:8px;display:block;margin:0 auto 10px;}
.img-upload svg{width:26px;height:26px;color:var(--text-3);margin-bottom:6px;}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}

/* ====================== TOAST / CONFIRM ====================== */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);color:var(--text-1);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.confirm-box{max-width:400px;text-align:center;padding:22px;}
.confirm-box h3{font-size:17px;margin-bottom:8px;}
.confirm-box p{font-size:13.5px;color:var(--text-2);line-height:1.5;margin-bottom:18px;}
.confirm-actions{display:flex;gap:10px;}

/* ====================== STORAGE INDICATOR ====================== */
.storage-strip{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-3);margin-top:8px;flex-wrap:wrap;}
.storage-strip svg{width:13px;height:13px;}
.storage-strip .dot{width:6px;height:6px;border-radius:50%;background:var(--court);flex:none;}
.storage-strip.warn .dot{background:var(--orange);}
.storage-strip a,.storage-strip button.linklike{color:var(--text-2);text-decoration:underline;font-size:11.5px;}

/* ====================== PLANNER ====================== */
.session-meta-card{padding:16px;margin-bottom:18px;}
.session-total{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:var(--radius-md);background:var(--surface-2);margin-bottom:16px;}
.session-total .num{font-family:var(--font-mono);font-size:20px;font-weight:700;}
.session-total .num.over{color:var(--orange);}
.plan-section{margin-bottom:16px;border:1px solid var(--border-soft);border-radius:var(--radius-lg);overflow:hidden;}
.plan-section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-1);gap:8px;}
.plan-section-head input{background:transparent;border:none;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.02em;padding:4px 0;width:auto;flex:1;}
.plan-section-body{padding:8px;display:flex;flex-direction:column;gap:6px;}
.plan-block{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:9px 10px;}
.plan-block .grip{color:var(--text-3);flex:none;}
.plan-block .grip svg{width:16px;height:16px;}
.plan-block .info{flex:1;min-width:0;}
.plan-block .info .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-block .info .sub{font-size:11px;color:var(--text-3);}
.plan-block .dur{width:52px;text-align:center;padding:6px 4px;font-family:var(--font-mono);font-size:13px;flex:none;}
.plan-block .rm{flex:none;color:var(--text-3);}
.plan-block .rm svg{width:16px;height:16px;}
.plan-block.note{background:var(--surface-3);}
.plan-block-order{display:flex;flex-direction:column;flex:none;}
.plan-block-order button{width:22px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
.plan-block-order svg{width:12px;height:12px;}
.add-block-row{display:flex;gap:6px;padding:8px;}
.section-add-btns{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px 12px;}
.cat-block{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:9px 10px;margin-bottom:8px;}
.cat-block-top{display:flex;align-items:center;gap:10px;}
.cat-block-top .info{flex:1;min-width:0;}
.cat-block-colors{display:flex;gap:6px;flex-wrap:wrap;padding-left:32px;}
.color-dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;flex:none;}
.color-dot.active{border-color:var(--text-1);}
.cat-en-uso{font-size:11px;color:var(--text-3);white-space:nowrap;flex:none;}

.picker-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;}
.picker-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);background:var(--surface-2);border:1px solid var(--border-soft);}
.picker-item .thumb{width:44px;height:44px;border-radius:8px;background:var(--surface-3);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.picker-item .thumb img{width:100%;height:100%;object-fit:cover;}
.picker-item .thumb svg{width:18px;height:18px;color:var(--text-3);}
.picker-item .info{flex:1;min-width:0;}
.picker-item .info .name{font-size:13.5px;font-weight:700;}
.picker-item .info .sub{font-size:11px;color:var(--text-3);}

/* ====================== HISTORY / STATS ====================== */
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.stat-bar-row .label{width:150px;flex:none;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-bar-track{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:999px;}
.stat-bar-row .val{width:56px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text-2);}
.period-switch{display:flex;gap:6px;margin-bottom:16px;}
.session-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-md);background:var(--surface-1);border:1px solid var(--border-soft);margin-bottom:8px;cursor:pointer;}
.session-row:hover{border-color:var(--border);}
.session-row .date-chip{width:52px;flex:none;text-align:center;background:var(--surface-2);border-radius:8px;padding:6px 0;font-family:var(--font-mono);}
.session-row .date-chip .d{font-size:16px;font-weight:700;line-height:1;}
.session-row .date-chip .m{font-size:9.5px;color:var(--text-3);text-transform:uppercase;}
.session-row .info{flex:1;min-width:0;}
.session-row .info .t{font-size:14px;font-weight:700;}
.session-row .info .s{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ====================== ZONA DE RENDERIZADO PARA PDF (fuera de pantalla) ======================
   #print-root nunca se ve en pantalla: vive fuera del viewport (position:fixed + left negativo)
   para que html2canvas pueda capturarla con su layout real y así generar un PDF de verdad,
   descargable como archivo. Antes se usaba window.print(), pero esa API no es fiable en apps
   instaladas en la pantalla de inicio de iOS (Safari en modo standalone) — por eso se cambió. */
#print-root{position:fixed;top:0;left:-10000px;width:800px;background:#fff;}

@media (max-width:480px){
  .field-row{grid-template-columns:1fr;}
}

/* ====================== HOJA DE IMPRESIÓN / PDF ====================== */
.print-page{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#15181b;background:#fff;max-width:800px;margin:0 auto;padding:26px 8px;}
.print-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #15181b;padding-bottom:12px;margin-bottom:14px;gap:16px;}
.print-header h1{font-family:'Oswald',Arial,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 3px;}
.print-header .sub{font-size:12.5px;color:#555;}
.print-header .badge-min{font-family:'JetBrains Mono',monospace;font-size:13px;border:1.5px solid #15181b;border-radius:8px;padding:6px 12px;text-align:center;white-space:nowrap;}
.print-objetivo{font-size:12.5px;background:#f1f1ee;border-radius:8px;padding:9px 12px;margin-bottom:16px;line-height:1.45;}
.print-section{margin-bottom:14px;page-break-inside:avoid;}
.print-section h2{font-family:'Oswald',Arial,sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.05em;background:#15181b;color:#fff;padding:5px 10px;border-radius:5px;margin:0 0 6px;}
.print-block{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid #e3e3df;}
.print-block:last-child{border-bottom:none;}
.print-block .pmin{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;width:40px;flex:none;padding-top:1px;}
.print-block .pimg{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:none;}
.print-block .pinfo{flex:1;min-width:0;}
.print-block .pinfo .pname{font-size:13px;font-weight:700;}
.print-block .pinfo .pcat{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#666;margin-bottom:2px;}
.print-block .pinfo .pdesc{font-size:11px;color:#444;line-height:1.4;margin-top:2px;}
.print-block.pnote{background:#f7f6f2;border-radius:6px;font-style:italic;}
.print-footer{margin-top:18px;padding-top:10px;border-top:1px solid #ddd;font-size:9.5px;color:#888;display:flex;justify-content:space-between;}
</style>

<div id="app"></div>
<div id="print-root"></div>
<input type="file" id="import-input" accept=".zip,.yaml,.yml" class="hidden">

<script>
'use strict';
/* ============================================================
   CUADERNO DE ENTRENAMIENTOS · BALONCESTO
   App single-file, sin servidor. Datos en localStorage,
   imágenes en IndexedDB. Ver README interno al final del archivo.
   ============================================================ */

/* ---------------- Constantes / taxonomía ---------------- */
const STORAGE_KEY = 'cuadernoEntrenos.v1';
const IDB_NAME = 'cuadernoEntrenosDB';
const IDB_VERSION = 1;
const IDB_STORE = 'imagenes';

/* ---------------- Carga diferida de librerías externas ----------------
   js-yaml/JSZip (copia de seguridad) y jsPDF/html2canvas (exportar a PDF) no se cargan al
   abrir la app: solo hacen falta para esas dos funciones concretas, así que cargarlas de
   entrada solo retrasaría la primera pintura sin necesidad. cargarScript() las descarga una
   sola vez (cachea la promesa) la primera vez que se necesitan; precargarLibsEnSegundoPlano()
   además las va trayendo en segundo plano cuando el navegador está libre, para que si el
   usuario las usa no tenga que esperar a la descarga en ese momento. */
const LIBS = {
  yaml: 'https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js',
  zip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js',
  html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
};
const _scriptCache = {};
function cargarScript(src){
  if(_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('No se pudo cargar '+src+' (¿sin conexión?)'));
    document.head.appendChild(el);
  });
  return _scriptCache[src];
}
async function asegurarLibsBackup(){
  await Promise.all([
    typeof window.jsyaml==='undefined' ? cargarScript(LIBS.yaml) : null,
    typeof window.JSZip==='undefined' ? cargarScript(LIBS.zip) : null,
  ]);
}
async function asegurarLibsPdf(){
  await Promise.all([
    typeof window.jspdf==='undefined' ? cargarScript(LIBS.jspdf) : null,
    typeof window.html2canvas==='undefined' ? cargarScript(LIBS.html2canvas) : null,
  ]);
}
function precargarLibsEnSegundoPlano(){
  const ir = window.requestIdleCallback || (fn => setTimeout(fn, 1500));
  ir(() => { Object.values(LIBS).forEach(src => { cargarScript(src).catch(()=>{}); }); });
}

// Categorías de ejercicio con las que arranca la app. A partir de aquí viven en state.categorias
// (gestionables desde Ajustes); esta lista solo se usa para sembrar la primera vez o si faltan

/* ---------------- Utilidades ---------------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function fmtMin(n){
  n = Math.round(n||0);
  if(n < 60) return n + ' min';
  const h = Math.floor(n/60), m = n%60;
  return m ? `${h}h ${m}min` : `${h}h`;
}
function fmtDateLong(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  const s = d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function fmtDayNum(iso){
  const d = new Date(iso+'T00:00:00');
  return { d: isNaN(d)?'--':d.getDate(), m: isNaN(d)?'':d.toLocaleDateString('es-ES',{month:'short'}).replace('.','') };
}
function todayIso(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTimestampLocal(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function parseTags(str){
  return String(str||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,12);
}

/* ---- Sugerencias de etiquetas ya usadas (para no acabar con "defensa" y "defensas" sueltas) ---- */
// Todas las etiquetas que ya existen en la biblioteca, más usadas primero.
function todasLasEtiquetas(){
  const cuenta = new Map();
  state.ejercicios.forEach(e => (e.etiquetas||[]).forEach(t => {
    const limpio = String(t||'').trim();
    if(!limpio) return;
    cuenta.set(limpio, (cuenta.get(limpio)||0) + 1);
  }));
  return [...cuenta.entries()].sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0],'es')).map(([t])=>t);
}
// A partir del texto tal cual está en el campo, separa los tags ya completos (antes de la última
// coma, o todos si el texto termina en coma) del fragmento que se está escribiendo ahora mismo.
function etiquetasYaEscritas(textoCrudo){
  const texto = String(textoCrudo||'');
  const terminaEnComa = /,\s*$/.test(texto) || texto.trim()==='';
  const partes = texto.split(',').map(s=>s.trim()).filter(Boolean);
  const completas = terminaEnComa ? partes : partes.slice(0,-1);
  const fragmento = terminaEnComa ? '' : (partes[partes.length-1]||'');
  return { completas, fragmento, completasLower: completas.map(t=>t.toLowerCase()), fragmentoLower: fragmento.toLowerCase() };
}
function sugerenciasEtiquetas(textoCrudo){
  const { completasLower, fragmentoLower } = etiquetasYaEscritas(textoCrudo);
  const completasSet = new Set(completasLower);
  return todasLasEtiquetas().filter(t=>{
    const tl = t.toLowerCase();
    if(completasSet.has(tl) || tl===fragmentoLower) return false;
    return !fragmentoLower || tl.includes(fragmentoLower);
  }).slice(0, 8);
}

let localStorageOk = true;
try{
  const k='__test__'+uid();
  localStorage.setItem(k,'1'); localStorage.removeItem(k);
}catch(e){ localStorageOk = false; }

let state = estadoVacio();

function loadState(){
  if(!localStorageOk) return estadoVacio();
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return estadoVacio();
    const parsed = JSON.parse(raw);
    const base = estadoVacio();
    return Object.assign(base, parsed, {
      ejercicios: (parsed.ejercicios || []).map(e => e.agrupacion ? e : { ...e, agrupacion: agrupacionDesdeJugadoresMin(e.jugadoresMin ?? 2) }),
      categorias: (parsed.categorias && parsed.categorias.length) ? parsed.categorias : base.categorias,
      plantillaSecciones: (parsed.plantillaSecciones && parsed.plantillaSecciones.length) ? parsed.plantillaSecciones : base.plantillaSecciones,
      sesiones: parsed.sesiones || [],
      ajustes: Object.assign(base.ajustes, parsed.ajustes||{}),
    });
  }catch(e){
    console.warn('No se pudo leer el estado guardado', e);
    return estadoVacio();
  }
}

let saveTimer = null;
let saveStatus = 'ok'; // ok | pending | error
function saveState(){
  saveStatus = 'pending';
  updateSaveBadge();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!localStorageOk){ saveStatus='error'; updateSaveBadge(); return; }
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveStatus = 'ok';
    }catch(e){
      saveStatus = 'error';
      console.warn('Error guardando estado', e);
    }
    updateSaveBadge();
  }, 180);
}
function updateSaveBadge(){
  const el = document.getElementById('save-badge');
  if(!el) return;
  if(saveStatus==='ok'){ el.textContent='Guardado'; el.className='save-badge ok'; }
  else if(saveStatus==='pending'){ el.textContent='Guardando…'; el.className='save-badge pending'; }
  else { el.textContent='Sin guardar'; el.className='save-badge err'; }
}

/* ---------------- IndexedDB (imágenes) ---------------- */
let idbPromise = null;
function idbOpen(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB no disponible')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE, { keyPath:'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return idbPromise;
}
async function idbPut(id, dataUrl, tipo){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put({ id, dataUrl, tipo, actualizadoEn: nowIso() });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ console.warn('idbPut falló', e); return false; }
}
async function idbGet(id){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}
async function idbDelete(id){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}
async function idbGetAll(){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return []; }
}
async function idbClearAll(){
  try{
    const db = await idbOpen();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).clear();
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}

// Cache en memoria de las imágenes (data URL) para no releer IndexedDB constantemente.
// Nota: las imágenes se guardan como data URL (string base64), no como Blob. Los Blob
// almacenados en IndexedDB han dado problemas de fiabilidad en Safari/iOS (tanto al
// generarlos con canvas.toBlob() como al leerlos de vuelta tras cerrar y reabrir la app),
// así que usamos toDataURL()/strings en todo el flujo para evitar esa clase de fallos.
const imgUrlCache = new Map(); // ejercicioId -> dataURL
async function getImagenUrl(ejercicioId){
  if(imgUrlCache.has(ejercicioId)) return imgUrlCache.get(ejercicioId);
  const row = await idbGet(ejercicioId);
  if(!row || !row.dataUrl) return null;
  imgUrlCache.set(ejercicioId, row.dataUrl);
  return row.dataUrl;
}
// Versión síncrona: solo lee lo que ya está en memoria, sin tocar IndexedDB. La usa la
// construcción del HTML para el PDF (construirHtmlSesion) para no tener que esperar a una
// lectura de IndexedDB por cada imagen; se apoya en que precalentarImagenes() (ver más abajo)
// ya ha traído todas las imágenes a memoria poco después de abrir la app.
function getImagenUrlCached(ejercicioId){
  return imgUrlCache.get(ejercicioId) || null;
}
async function precalentarImagenes(){
  try{
    const rows = await idbGetAll();
    rows.forEach(row => { if(row && row.dataUrl) imgUrlCache.set(row.id, row.dataUrl); });
  }catch(e){ console.warn('No se pudieron precargar las imágenes', e); }
}
function invalidateImagenUrl(ejercicioId){
  imgUrlCache.delete(ejercicioId);
}

// Conversión entre data URL (formato de almacenamiento en IndexedDB) y Blob (formato de
// archivo real dentro del .zip de copia de seguridad, para que las imágenes sean archivos
// .jpg normales y legibles fuera de la app, no texto base64).
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mimeMatch = /data:(.*?);base64/.exec(header);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function blobToDataUrl(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function estimarAlmacenamiento(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const { usage, quota } = await navigator.storage.estimate();
      return { usage, quota };
    }
  }catch(e){}
  return null;
}

/* Comprime y redimensiona una imagen (File) a JPEG antes de guardarla.
   Devuelve un data URL (string), no un Blob: canvas.toBlob() ha demostrado ser poco
   fiable en Safari/iOS (callback que a veces no llega, sobre todo con imágenes grandes
   recién sacadas de Fotos/iCloud), mientras que canvas.toDataURL() es síncrono y lleva
   soportado de forma estable en WebKit mucho más tiempo. */
function comprimirImagen(file, maxDim=1000, calidad=0.72){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      try{
        let { width, height } = img;
        if(!width || !height) throw new Error('Imagen sin dimensiones válidas');
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', calidad);
        if(!dataUrl || dataUrl.length < 30 || !dataUrl.startsWith('data:image/jpeg')){
          throw new Error('No se pudo procesar la imagen');
        }
        resolve(dataUrl);
      }catch(err){ reject(err); }
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Tras cada render (y en cada tecla sobre el campo), repinta solo el bloque de sugerencias de
   etiquetas sin tocar el <input>, para no perder el cursor mientras se escribe. */
function renderSugerenciasEtiquetasHtml(textoCrudo){
  const lista = sugerenciasEtiquetas(textoCrudo);
  if(!lista.length) return '';
  const { fragmento } = etiquetasYaEscritas(textoCrudo);
  return `<div class="hint" style="margin:6px 0 4px;">${fragmento?'Etiquetas parecidas que ya usas:':'Etiquetas que ya usas:'}</div>
    <div class="tag-suggestions">${lista.map(t=>`<button type="button" class="tag tag-suggestion" data-action="anadir-etiqueta-sugerida" data-tag="${escapeHtml(t)}">+ ${escapeHtml(t)}</button>`).join('')}</div>`;
}
function actualizarSugerenciasEtiquetasDom(){
  const cont = document.getElementById('etiquetas-sugerencias');
  const input = document.querySelector('[data-draft="etiquetas"]');
  if(!cont || !input) return;
  cont.innerHTML = renderSugerenciasEtiquetasHtml(input.value);
}
function anadirEtiquetaSugerida(tag){
  const input = document.querySelector('[data-draft="etiquetas"]');
  if(!input || !formDraft) return;
  const { completas } = etiquetasYaEscritas(input.value);
  const vistas = new Set();
  const final = [...completas, tag].filter(t=>{
    const k = t.toLowerCase();
    if(vistas.has(k)) return false;
    vistas.add(k); return true;
  });
  input.value = final.join(', ') + ', ';
  formDraft.etiquetas = parseTags(input.value);
  input.focus();
  const fin = input.value.length;
  try{ input.setSelectionRange(fin, fin); }catch(err){}
  actualizarSugerenciasEtiquetasDom();
}

/* Tras cada render, busca elementos [data-img-for] y les carga la imagen desde IndexedDB */
function hidratarImagenesVisibles(){
  document.querySelectorAll('[data-img-for]').forEach(async el => {
    const id = el.getAttribute('data-img-for');
    const url = await getImagenUrl(id);
    if(url){
      el.innerHTML = `<img src="${url}" alt="">`;
    }
  });
}

function filteredEjercicios(){
  const { query, categoria, soloFavoritos } = ui.biblioteca;
  const q = query.trim().toLowerCase();
  return state.ejercicios.filter(e=>{
    if(categoria!=='todas' && e.categoria!==categoria) return false;
    if(soloFavoritos && !e.favorito) return false;
    if(q){
      const hay = [e.nombre, (e.etiquetas||[]).join(' '), e.objetivo].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> (b.favorito - a.favorito) || a.nombre.localeCompare(b.nombre,'es'));
}

function renderModal(modal){
  const { type, props } = modal;
  let inner = '';
  if(type==='confirm') inner = renderModalConfirm(props);
  else if(type==='ver-ejercicio') inner = renderModalVerEjercicio(props);
  else if(type==='form-ejercicio') inner = renderModalFormEjercicio(props);
  else if(type==='ajustes') inner = renderModalAjustes(props);
  else if(type==='elegir-ejercicio') inner = renderModalElegirEjercicio(props);
  else if(type==='elegir-plantilla') inner = renderModalElegirPlantilla(props);
  else if(type==='sesion-form') inner = renderModalSesionForm(props);
  return `<div class="overlay" data-action="cerrar-overlay">${inner}</div>`;
}

async function guardarEjercicio(id){
  const e = formDraft;
  if(!e.nombre || !e.nombre.trim()){ toast('Ponle un nombre al ejercicio'); return; }
  if(subiendoImagen){ toast('Espera un momento, todavía se está procesando la imagen…'); return; }
  e.actualizadoEn = nowIso();
  const isNew = !id;
  if(isNew) e.creadoEn = nowIso();

  if(typeof formDraftImagenData === 'string'){
    await idbPut(e.id, formDraftImagenData, 'image/jpeg');
    e.tieneImagen = true;
    imgUrlCache.set(e.id, formDraftImagenData); // deja la caché caliente sin releer IndexedDB
  } else if(formDraftImagenData === null){
    await idbDelete(e.id);
    e.tieneImagen = false;
    invalidateImagenUrl(e.id);
  }

  const idx = state.ejercicios.findIndex(x=>x.id===e.id);
  if(idx>=0) state.ejercicios[idx] = e;
  else state.ejercicios.push(e);

  saveState();
  formDraft = null; formDraftImagenData = undefined;
  closeModal();
  toast(isNew?'Ejercicio creado':'Ejercicio actualizado');
}

function eliminarEjercicio(id){
  confirmar({
    title:'Eliminar ejercicio',
    message:'Se eliminará de tu biblioteca. Las sesiones ya planificadas que lo usan conservarán su nombre e información, pero no podrás volver a añadirlo desde la biblioteca.',
    confirmLabel:'Eliminar',
    onConfirm: async () => {
      state.ejercicios = state.ejercicios.filter(x=>x.id!==id);
      await idbDelete(id);
      invalidateImagenUrl(id);
      saveState();
      closeModal();
      toast('Ejercicio eliminado');
    }
  });
}

/* ---- Mutaciones de sección / bloque ---- */
function tocarSesion(s){ s.actualizadoEn = nowIso(); saveState(); }

function anadirSeccion(sid){
  const s = state.sesiones.find(x=>x.id===sid);
  s.secciones.push({ id: uid(), nombre:'Nueva sección', bloques:[] });
  tocarSesion(s); render();
}
function eliminarSeccion(sid, secid){
  const s = state.sesiones.find(x=>x.id===sid);
  const sec = s.secciones.find(x=>x.id===secid);
  const doIt = () => { s.secciones = s.secciones.filter(x=>x.id!==secid); tocarSesion(s); render(); };
  if(sec.bloques.length){
    confirmar({ title:'Eliminar sección', message:`Esta sección tiene ${sec.bloques.length} bloque(s). Se eliminarán también.`, confirmLabel:'Eliminar', onConfirm:()=>{ doIt(); closeModal(); } });
  } else doIt();
}
function moverSeccion(sid, secid, dir){
  const s = state.sesiones.find(x=>x.id===sid);
  const i = s.secciones.findIndex(x=>x.id===secid);
  const j = i+dir;
  if(j<0 || j>=s.secciones.length) return;
  [s.secciones[i], s.secciones[j]] = [s.secciones[j], s.secciones[i]];
  tocarSesion(s); render();
}
function renombrarSeccion(sid, secid, val){
  const s = state.sesiones.find(x=>x.id===sid);
  s.secciones.find(x=>x.id===secid).nombre = val;
  tocarSesion(s);
}
function anadirNota(sid, secid){
  const s = state.sesiones.find(x=>x.id===sid);
  s.secciones.find(x=>x.id===secid).bloques.push({ id: uid(), tipo:'nota', texto:'', duracionMin:0 });
  tocarSesion(s); render();
}
function editarNota(sid, secid, bid, val){
  const s = state.sesiones.find(x=>x.id===sid);
  s.secciones.find(x=>x.id===secid).bloques.find(b=>b.id===bid).texto = val;
  tocarSesion(s);
}
function cambiarDuracionBloque(sid, secid, bid, val){
  const s = state.sesiones.find(x=>x.id===sid);
  const b = s.secciones.find(x=>x.id===secid).bloques.find(b=>b.id===bid);
  b.duracionMin = clamp(parseInt(val||'0',10)||0, 0, 240);
  tocarSesion(s);
  const totalEl = document.querySelector('.session-total .num');
  if(totalEl){
    const total = totalMinutosSesion(s);
    const objetivo = s.duracionObjetivoMin||0;

    totalEl.innerHTML = `${fmtMin(total)} <span style="font-size:13px;color:var(--text-3);font-weight:500;">/ objetivo ${fmtMin(objetivo)}</span>`;
  }
}

function moverBloque(sid, secid, bid, dir){

}

/* ================= TAB: HISTORIAL ================= */
function inicioSemana(d){
  const x = new Date(d); const day = (x.getDay()+6)%7; // lunes=0
  x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x;
}
function rangoPeriodo(periodo){
  const hoy = new Date();
  if(periodo==='semana'){
    const ini = inicioSemana(hoy);
    const fin = new Date(ini); fin.setDate(fin.getDate()+6);
    return { ini, fin };
  }
  if(periodo==='mes'){
    const ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    const fin = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
    return { ini, fin };
  }
  return null; // temporada = sin límite
}
function sesionEnRango(s, rango){
  if(!rango) return true;
  const f = new Date(s.fecha+'T00:00:00');
  return f >= rango.ini && f <= new Date(rango.fin.getFullYear(),rango.fin.getMonth(),rango.fin.getDate(),23,59,59);
}

  })));

  return `

        <div class="val">${fmtMin(porCategoria[c.id])}</div>
      </div>`).join('')}
    <div class="hint" style="margin:8px 0 10px;">${fmtMin(totalMin)} entrenados en total en ${sesiones.length} sesión(es) de este periodo.</div>
  </div>` : `<div class="empty" style="padding:28px 20px;">${ICONS.historial}<p>Sin datos en este periodo todavía.</p></div>`}

  <div class="section-head"><h2>Sesiones cerradas</h2></div>
  ${sesiones.length ? sesiones.map(s=>`

      <div class="date-chip"><div class="d">${fmtDayNum(s.fecha).d}</div><div class="m">${fmtDayNum(s.fecha).m}</div></div>
      <div class="info">
        <div class="t">${escapeHtml(s.titulo || 'Entrenamiento sin título')}</div>

      </div>

/* ================= EXPORTAR A PDF =================
   Genera un PDF de verdad (archivo descargable), en vez de usar window.print(). Ese era el
   enfoque anterior y no es fiable en una app instalada en la pantalla de inicio de un iPad
   (Safari en modo standalone): el diálogo de impresión de iOS no funciona bien ahí, con o sin
   async de por medio — es una limitación de la propia plataforma, no del código. Al generar el
   PDF nosotros mismos (html2canvas capa la ficha en #print-root, jsPDF la mete en páginas A4)
   y descargarlo como archivo con un <a download>, usamos exactamente el mismo mecanismo de
   descarga que ya funciona bien en "Exportar copia de seguridad" — nada que dependa del
   soporte de impresión del navegador. */
function construirHtmlSesion(s){
  const total = totalMinutosSesion(s);
  let seccionesHtml = '';
  for(const sec of s.secciones){
    if(!sec.bloques.length) continue;
    let bloquesHtml = '';
    for(const b of sec.bloques){
      if(b.tipo==='nota'){
        if(!b.texto && !b.duracionMin) continue;
        bloquesHtml += `<div class="print-block pnote">
          <div class="pmin">${b.duracionMin?fmtMin(b.duracionMin):''}</div>
          <div class="pinfo"><div class="pdesc">${escapeHtml(b.texto)}</div></div>
        </div>`;
        continue;
      }
      const ejercicioVivo = state.ejercicios.find(e=>e.id===b.ejercicioId);
      const c = catById(b.categoriaSnapshot);
      let imgTag = '';
      if(ejercicioVivo && ejercicioVivo.tieneImagen){
        const url = getImagenUrlCached(ejercicioVivo.id);
        if(url) imgTag = `<img class="pimg" src="${url}">`;
      }
      const descBits = [];
      if(ejercicioVivo){
        if(ejercicioVivo.objetivo) descBits.push(ejercicioVivo.objetivo);
      } else {
        descBits.push('(Ejercicio ya no está en la biblioteca)');
      }
      bloquesHtml += `<div class="print-block">
        ${imgTag}
        <div class="pmin">${fmtMin(b.duracionMin)}</div>
        <div class="pinfo">
          <div class="pcat" style="color:${c.color}">${c.label}</div>
          <div class="pname">${escapeHtml(b.nombreSnapshot)}</div>
          ${descBits.length?`<div class="pdesc">${escapeHtml(descBits.join(' '))}</div>`:''}
        </div>
      </div>`;
    }
    if(!bloquesHtml) continue;
    seccionesHtml += `<div class="print-section"><h2>${escapeHtml(sec.nombre)}</h2>${bloquesHtml}</div>`;
  }

  return `<div class="print-page">
    <div class="print-header">
      <div>
        <h1>${escapeHtml(s.titulo || 'Entrenamiento')}</h1>
        <div class="sub">${fmtDateLong(s.fecha)}</div>
      </div>
      <div class="badge-min">${fmtMin(total)}<br><span style="font-weight:400;font-size:10px;">planificados</span></div>
    </div>
    ${s.objetivo?`<div class="print-objetivo"><strong>Objetivo del día:</strong> ${escapeHtml(s.objetivo)}</div>`:''}
    ${seccionesHtml || '<p style="font-size:12.5px;color:#777;">Esta sesión todavía no tiene ejercicios añadidos.</p>'}
    ${s.avisos?`<div class="print-objetivo" style="margin-top:6px;"><strong>Avisos:</strong> ${escapeHtml(s.avisos)}</div>`:''}
    <div class="print-footer"><span>Cuaderno de Entrenamientos</span><span>Generado ${new Date().toLocaleString('es-ES')}</span></div>
  </div>`;
}
function nombreArchivoSesion(s, ext){
  const base = (s.titulo || 'entrenamiento').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'') // quita acentos
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'entrenamiento';
  return `${base}_${s.fecha}.${ext}`;
}
async function exportarPdfSesion(id){
  const s = state.sesiones.find(x=>x.id===id);
  if(!s) return;
  toast('Generando PDF…');
  const root = document.getElementById('print-root');
  try{
    await asegurarLibsPdf();
    root.innerHTML = construirHtmlSesion(s);
    // Deja que las imágenes (ya son data URL, no hay red de por medio) y el layout se asienten.
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const nodo = root.querySelector('.print-page');
    const canvas = await html2canvas(nodo, { scale:2, backgroundColor:'#ffffff', useCORS:true });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:'pt', format:'a4' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * (imgW / canvas.width);
    const imgData = canvas.toDataURL('image/jpeg', 0.92);

    let heightLeft = imgH;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
    heightLeft -= pageH;
    while(heightLeft > 0){
      position -= pageH;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgW, imgH);
      heightLeft -= pageH;
    }

    pdf.save(nombreArchivoSesion(s, 'pdf'));
    toast('PDF descargado');
  }catch(err){
    console.error(err);
    toast('No se pudo generar el PDF: ' + (err.message || 'error desconocido'));
  }finally{
    root.innerHTML = ''; // libera memoria (imágenes en base64 pueden pesar bastante)
  }
}
/* ================= EXPORTAR / IMPORTAR (.zip: datos.yaml + imágenes) ================= */
async function exportarTodo(){
  toast('Generando copia de seguridad…');
  try{
    await asegurarLibsBackup();
    const datos = {
      version: 1,
      app: 'cuaderno-entrenamientos',
      exportedAt: nowIso(),
      categorias: state.categorias,
      plantillaSecciones: state.plantillaSecciones,
      ejercicios: state.ejercicios,
      sesiones: state.sesiones,
    };
    const yamlText = jsyaml.dump(datos, { lineWidth:100, noRefs:true });
    const zip = new JSZip();
    zip.file('datos.yaml', yamlText);
    const carpeta = zip.folder('imagenes');
    const conImagen = state.ejercicios.filter(e=>e.tieneImagen);
    for(const e of conImagen){
      const row = await idbGet(e.id);
      if(row && row.dataUrl) carpeta.file(`${e.id}.jpg`, dataUrlToBlob(row.dataUrl));
    }
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{ level:6 } });
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = `cuaderno-entrenamientos-${nowTimestampLocal()}.zip`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);

    state.ajustes.lastBackupAt = nowIso();
    saveState();
    actualizarInfoAlmacenamiento();
    toast('Copia de seguridad descargada');
  }catch(e){
    console.error(e);
    toast('No se pudo generar la copia de seguridad');
  }
}

function dispararImportar(){ document.getElementById('import-input').click(); }

async function manejarArchivoImportado(file){
  if(!file) return;
  try{
    await asegurarLibsBackup();
    let datos, imagenes = []; // [{id, dataUrl}]
    if(/\.zip$/i.test(file.name)){
      const zip = await JSZip.loadAsync(file);
      const datosFile = zip.file('datos.yaml');
      if(!datosFile) throw new Error('El zip no contiene datos.yaml');
      const yamlText = await datosFile.async('string');
      datos = jsyaml.load(yamlText);
      const carpeta = zip.folder('imagenes');
      const entries = [];
      carpeta.forEach((relPath, f) => { if(!f.dir) entries.push(f); });
      for(const f of entries){
        const id = f.name.split('/').pop().replace(/\.[^.]+$/,'');
        const blob = await f.async('blob');
        const dataUrl = await blobToDataUrl(blob);
        imagenes.push({ id, dataUrl });
      }
    } else {
      const text = await file.text();
      datos = jsyaml.load(text);
    }
    if(!datos || !Array.isArray(datos.ejercicios)) throw new Error('Formato no reconocido');

    const nEj = datos.ejercicios.length, nSes = (datos.sesiones||[]).length, nImg = imagenes.length;
    const fechaExport = datos.exportedAt ? new Date(datos.exportedAt).toLocaleString('es-ES') : 'desconocida';
    confirmar({
      title:'Importar copia de seguridad',
      message:`Vas a reemplazar TODOS tus datos actuales por esta copia (${nEj} ejercicios, ${nSes} sesiones, ${nImg} imágenes) exportada el ${fechaExport}. Esta acción no se puede deshacer.`,
      confirmLabel:'Reemplazar datos',
      onConfirm: async () => {
        await idbClearAll();
        imgUrlCache.clear();
        for(const img of imagenes){
          await idbPut(img.id, img.dataUrl, 'image/jpeg');
          imgUrlCache.set(img.id, img.dataUrl); // ya las tenemos en memoria, no hace falta releer IndexedDB
        }
        state = {
          version:1,
          ejercicios: datos.ejercicios || [],
          categorias: (datos.categorias && datos.categorias.length) ? datos.categorias : CATEGORIAS_POR_DEFECTO.map(c=>({...c})),
          plantillaSecciones: (datos.plantillaSecciones && datos.plantillaSecciones.length) ? datos.plantillaSecciones : SECCIONES_POR_DEFECTO.map(s=>({...s})),
          sesiones: datos.sesiones || [],
          ajustes: { lastBackupAt: state.ajustes.lastBackupAt, seeded:true },
        };
        saveState();
        ui.planificador.sesionId = null;
        closeModal();
        render();
        toast('Datos importados correctamente');
      }
    });
  }catch(e){
    console.error(e);
    toast('No se pudo leer ese archivo: ' + e.message);
  }
}

function limpiarFiltrosBiblioteca(){
  ui.biblioteca = { query:'', categoria:'todas', soloFavoritos:false, verId:null };
  render();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action === 'cerrar-overlay' && e.target.closest('[data-stop]')) return;
  // Los modales con un formulario a medio rellenar (nuevo/editar ejercicio, nueva/editar sesión) no
  // se cierran al tocar fuera: sería muy fácil perder todo lo escrito con un toque accidental. Para
  // esos hace falta "Cancelar" o la X, que sí usan 'cerrar-modal' explícitamente.
  if(action === 'cerrar-overlay' && ui.modal && (ui.modal.type==='form-ejercicio' || ui.modal.type==='sesion-form')) return;

  const id = el.dataset.id, sid = el.dataset.sid, secid = el.dataset.secid, bid = el.dataset.bid, eid = el.dataset.eid;
  const dir = el.dataset.dir ? parseInt(el.dataset.dir,10) : 0;

  switch(action){
    case 'tab': ui.tab = el.dataset.tab; render(); break;
    case 'abrir-ajustes': abrirAjustes(); break;
    case 'cerrar-modal': case 'cerrar-overlay': formDraft=null; formDraftImagenData=undefined; sesionFormDraft=null; closeModal(); break;
    case 'confirmar-accion': { const cb = ui.modal && ui.modal.props && ui.modal.props.onConfirm; if(cb) cb(); break; }
    case 'draft-stepper': {
      const campo = el.dataset.draft;
      const minv = parseInt(el.dataset.min,10), maxv = parseInt(el.dataset.max,10);
      let v = (parseInt(formDraft[campo],10)||0) + dir;
      if(v < minv) v = minv;
      if(v > maxv) v = maxv;
      formDraft[campo] = v;
      render();
      break;
    }

    // Biblioteca
    case 'nuevo-ejercicio': abrirFormEjercicio(null); break;
    case 'ver-ejercicio': openModal('ver-ejercicio', { id }); break;
    case 'editar-ejercicio': abrirFormEjercicio(id); break;
    case 'eliminar-ejercicio': eliminarEjercicio(id); break;
    case 'toggle-favorito': { const ex = state.ejercicios.find(x=>x.id===id); ex.favorito = !ex.favorito; saveState(); render(); break; }
    case 'guardar-ejercicio': guardarEjercicio(el.dataset.id || null); break;
    case 'quitar-imagen-draft': formDraftImagenData = null; render(); break;
    case 'anadir-etiqueta-sugerida': anadirEtiquetaSugerida(el.dataset.tag); break;
    case 'draft-categoria': formDraft.categoria = el.dataset.cat; render(); break;
    case 'draft-agrupacion': formDraft.agrupacion = el.dataset.agr; render(); break;
    case 'filtro-categoria': ui.biblioteca.categoria = el.dataset.cat; render(); break;
    case 'toggle-favoritos-filtro': ui.biblioteca.soloFavoritos = !ui.biblioteca.soloFavoritos; render(); break;
    case 'limpiar-filtros-biblioteca': limpiarFiltrosBiblioteca(); break;

    // Planificador — sesión
    case 'abrir-nueva-sesion': abrirNuevaSesion(); break;
    case 'continuar-sesion': ui.planificador.sesionId = id; render(); break;
    case 'abrir-elegir-plantilla': abrirElegirPlantilla(); break;
    case 'usar-sesion-plantilla': duplicarSesion(id); break;
    case 'volver-planificador-landing': ui.planificador.sesionId = null; render(); break;
    case 'editar-meta-sesion': abrirEditarMetaSesion(id); break;
    case 'guardar-sesion-form': guardarSesionForm(el.dataset.id || null); break;
    case 'cerrar-sesion': cerrarSesion(id); break;
    case 'eliminar-sesion': eliminarSesion(id); break;
    case 'duplicar-sesion': duplicarSesion(id); break;
    case 'exportar-pdf-sesion': exportarPdfSesion(id); break;

    // Planificador — secciones / bloques
    case 'anadir-seccion': anadirSeccion(sid); break;
    case 'eliminar-seccion': eliminarSeccion(sid, secid); break;
    case 'mover-seccion': moverSeccion(sid, secid, dir); break;
    case 'anadir-nota': anadirNota(sid, secid); break;
    case 'eliminar-bloque': eliminarBloque(sid, secid, bid); break;
    case 'mover-bloque': moverBloque(sid, secid, bid, dir); break;
    case 'abrir-elegir-ejercicio': abrirElegirEjercicio(sid, secid); break;
    case 'elegir-ejercicio-bloque': elegirEjercicioParaBloque(sid, secid, eid); break;

    // Historial
    case 'abrir-sesion-historial': abrirSesionHistorial(id); break;
    case 'periodo-historial': ui.historial.periodo = el.dataset.periodo; render(); break;

    // Ajustes / plantilla de secciones
    case 'exportar-todo': exportarTodo(); break;
    case 'disparar-importar': dispararImportar(); break;
    case 'anadir-seccion-plantilla': anadirSeccionPlantilla(); break;
    case 'eliminar-seccion-plantilla': eliminarSeccionPlantilla(el.dataset.secid); break;
    case 'mover-seccion-plantilla': moverSeccionPlantilla(el.dataset.secid, dir); break;
    case 'anadir-categoria': anadirCategoria(); break;
    case 'eliminar-categoria': eliminarCategoria(el.dataset.catid); break;
    case 'mover-categoria': moverCategoria(el.dataset.catid, dir); break;
    case 'recolorear-categoria': recolorearCategoria(el.dataset.catid, el.dataset.color, el.dataset.bg); break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-action],[data-draft],[data-sdraft]');
  if(!el) return;

  if(el.dataset.draft){
    let v = el.value;
    if(el.dataset.draft==='duracionMin') v = parseInt(v||'0',10)||0;
    if(el.dataset.draft==='material' || el.dataset.draft==='etiquetas') v = parseTags(v);
    formDraft[el.dataset.draft] = v;
    if(el.dataset.draft==='etiquetas') actualizarSugerenciasEtiquetasDom();
    return;
  }
  if(el.dataset.sdraft){
    let v = el.value;
    if(el.dataset.sdraft==='duracionObjetivoMin') v = parseInt(v||'0',10)||0;
    if(el.dataset.sdraft==='fecha' && sesionFormDraft.titulo === sesionFormDraft.fecha){
      // El título todavía es el de la fecha por defecto (no lo han personalizado): que
      // siga reflejando la fecha elegida, incluido el campo visible.
      sesionFormDraft.titulo = v;
      const tituloInput = document.querySelector('[data-sdraft="titulo"]');
      if(tituloInput) tituloInput.value = v;
    }
    sesionFormDraft[el.dataset.sdraft] = v;
    return;
  }
  const action = el.dataset.action;
  if(action==='buscar-biblioteca'){
    const pos = el.selectionStart;
    ui.biblioteca.query = el.value;
    render();
    const el2 = document.querySelector('[data-action="buscar-biblioteca"]');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(err){} }
  } else if(action==='buscar-picker'){
    const pos = el.selectionStart;
    ui.planificador.pickerQuery = el.value;
    render();
    const el2 = document.querySelector('[data-action="buscar-picker"]');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(err){} }
  } else if(action==='buscar-plantilla'){
    const pos = el.selectionStart;
    ui.planificador.plantillaQuery = el.value;
    render();
    const el2 = document.querySelector('[data-action="buscar-plantilla"]');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(err){} }
  } else if(action==='renombrar-seccion'){
    renombrarSeccion(el.dataset.sid, el.dataset.secid, el.value);
  } else if(action==='renombrar-seccion-plantilla'){
    renombrarSeccionPlantilla(el.dataset.secid, el.value);
  } else if(action==='renombrar-categoria'){
    renombrarCategoria(el.dataset.catid, el.value);
  } else if(action==='editar-nota'){
    editarNota(el.dataset.sid, el.dataset.secid, el.dataset.bid, el.value);
  } else if(action==='cambiar-duracion-bloque'){
    cambiarDuracionBloque(el.dataset.sid, el.dataset.secid, el.dataset.bid, el.value);
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target.closest('[data-action],[data-draft],[data-sdraft]');
  if(!el) return;
  if(el.dataset.sdraft==='fecha'){
    // Si el título todavía es el de la fecha por defecto (no lo han personalizado), lo
    // actualizamos para que siga reflejando la fecha elegida, incluido el campo visible.
    if(sesionFormDraft.titulo === sesionFormDraft.fecha){
      sesionFormDraft.titulo = el.value;
      const tituloInput = document.querySelector('[data-sdraft="titulo"]');
      if(tituloInput) tituloInput.value = el.value;
    }
    sesionFormDraft.fecha = el.value;
    return;
  }
  const action = el.dataset.action;
  if(action==='input-imagen'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    subiendoImagen = true;
    render();
    toast('Procesando imagen…');
    try{
      const dataUrl = await comprimirImagen(file);
      formDraftImagenData = dataUrl;
    }catch(err){ console.error(err); toast('No se pudo procesar la imagen'); }
    finally{ subiendoImagen = false; render(); }
  }
});

document.getElementById('import-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(file) manejarArchivoImportado(file);
});

/* ================= INIT ================= */
let _inited = false;
function init(){
  if(_inited) return;
  _inited = true;
  state = loadState();
  asegurarSemilla();
  if(!localStorageOk) toast('Este navegador no permite guardar datos aquí: nada se conservará al salir.');
  render();
  // Trabajo de fondo tras la primera pintura, sin bloquearla: imágenes en memoria (evita
  // releer IndexedDB cada vez que se muestran) y precarga de las librerías de backup/PDF.
  precalentarImagenes();
  precargarLibsEnSegundoPlano();
}
document.addEventListener('DOMContentLoaded', init);
if(document.readyState==='complete' || document.readyState==='interactive') init();
</script>
