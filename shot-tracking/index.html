<title>Series · Control de tiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
  :root{
    --bg:#12151c;
    --surface-1:#1b2029;
    --surface-2:#242b38;
    --surface-3:#2c3444;
    --border:#323b4c;
    --border-soft:#262d3a;
    --amber:#e8873a;
    --amber-dim:#c96f27;
    --amber-glow:rgba(232,135,58,.35);
    --amber-bg:rgba(232,135,58,.14);
    --cyan:#3fa9be;
    --cyan-bg:rgba(63,169,190,.14);
    --success:#35b87a;
    --success-bg:rgba(53,184,122,.14);
    --danger:#e85d5d;
    --danger-bg:rgba(232,93,93,.14);
    --violet:#9b7bd6;
    --violet-bg:rgba(155,123,214,.14);
    --text-1:#f2f0ea;
    --text-2:#a9b1c3;
    --text-3:#6b7386;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --font-display:'Oswald',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-1);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:64px;
    overscroll-behavior-y:none;
  }
  ::selection{background:var(--amber);color:#1a1206;}
  button{
    font-family:inherit;cursor:pointer;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    transition:transform .08s ease;
  }
  button:active{transform:scale(0.96);}
  input{font-family:inherit;}
  h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.02em;}

  /* ---------- Header ---------- */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(27,32,41,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:14px 20px;
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand h1{font-size:20px;font-weight:700;color:var(--text-1);text-transform:uppercase;letter-spacing:.08em;}
  .brand h1 span{color:var(--amber);}
  .brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-3);letter-spacing:.12em;text-transform:uppercase;margin-top:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .save-badge{font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:5px;font-weight:700;}
  .save-badge.ok{color:var(--success);background:var(--success-bg);}
  .save-badge.pending{color:var(--amber);background:var(--amber-bg);}

  .io-actions{display:flex;gap:8px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:999px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text-1);
    padding:9px 16px;font-size:13px;font-weight:600;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .btn:active{transform:scale(.96);}
  .btn:hover{border-color:var(--text-3);}
  .btn-ghost{background:transparent;}
  .btn-amber{background:var(--amber);border-color:var(--amber);color:#1a1206;}
  .btn-amber:hover{background:var(--amber-dim);border-color:var(--amber-dim);}
  .btn-danger-outline{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-icon{padding:8px;border-radius:10px;}

  nav.tabs{max-width:1180px;margin:14px auto 0;padding:0 20px;display:flex;gap:6px;}
  .tab-btn{
    background:transparent;border:none;color:var(--text-3);
    font-family:var(--font-display);font-size:14px;letter-spacing:.03em;text-transform:uppercase;
    padding:10px 4px;margin-right:22px;border-bottom:2px solid transparent;
    transition:color .15s,border-color .15s;
  }
  .tab-btn.active{color:var(--text-1);border-color:var(--amber);}
  .tab-btn:disabled{color:#454c5c;cursor:default;}
  .tab-badge{font-family:var(--font-mono);font-size:9px;background:var(--surface-3);color:var(--text-3);padding:2px 6px;border-radius:6px;margin-left:6px;letter-spacing:.03em;vertical-align:1px;}

  main{max-width:1180px;margin:0 auto;padding:24px 20px 40px;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center;padding:60px 20px;color:var(--text-3);
    border:1px dashed var(--border);border-radius:var(--radius-lg);
  }
  .empty svg{opacity:.5;margin-bottom:14px;}
  .empty h3{color:var(--text-2);font-size:17px;margin-bottom:6px;text-transform:none;}
  .empty p{font-size:13.5px;max-width:360px;margin:0 auto 18px;line-height:1.5;}

  /* ---------- Jugadores ---------- */
  .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .player-card{
    background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-md);
    padding:16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    position:relative;
  }
  .jersey-badge{
    width:52px;height:52px;border-radius:50%;
    background:var(--surface-3);border:2px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--amber);
  }
  .player-card .p-name{font-size:14px;font-weight:600;color:var(--text-1);}
  .player-card-actions{display:flex;gap:6px;position:absolute;top:8px;right:8px;}
  .icon-btn{
    width:26px;height:26px;border-radius:7px;background:var(--surface-3);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-2);
  }
  .icon-btn:hover{color:var(--text-1);border-color:var(--text-3);}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);}

  .status-pill{
    width:100%;padding:7px 8px;border-radius:8px;font-size:11.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-3);
  }
  .status-pill.baja:hover{border-color:var(--danger);color:var(--danger);}
  .status-pill.reactivar{border-color:var(--success);color:var(--success);background:var(--success-bg);}
  .player-card.is-baja{opacity:.62;}
  .player-card.is-baja .jersey-badge{border-color:var(--border);}

  .bajas-toggle{
    margin-top:16px;padding:8px 4px;background:none;border:none;color:var(--text-3);
    font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;
  }
  .bajas-toggle:hover{color:var(--text-2);}
  .bajas-grid{margin-top:10px;}

  .add-player-card{
    border:1.5px dashed var(--border);border-radius:var(--radius-md);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--text-3);background:transparent;min-height:118px;font-size:13px;font-weight:600;
    transition:border-color .15s,color .15s;
  }
  .add-player-card:hover{border-color:var(--amber);color:var(--amber);}

  /* ---------- Entrenamiento: fecha bar ---------- */
  .date-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    margin-bottom:20px;
  }
  .date-field{
    display:flex;align-items:center;gap:12px;background:var(--surface-1);border:1.5px solid var(--border-soft);
    border-radius:var(--radius-md);padding:10px 16px;
  }
  .date-field label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  input[type=date]{
    background:var(--surface-2);border:1.5px solid var(--border);color:var(--text-1);
    border-radius:var(--radius-sm);padding:11px 14px;font-size:16px;font-weight:600;
    font-family:var(--font-body);min-height:44px;min-width:170px;
  }
  input[type=date]::-webkit-calendar-picker-indicator{
    padding:6px;margin-left:6px;cursor:pointer;
    filter:invert(72%) sepia(30%) saturate(700%) hue-rotate(346deg) brightness(101%);
  }
  .groups-toolbar{display:flex;gap:10px;margin-bottom:14px;}

  /* ---------- Group card ---------- */
  .group-card{
    background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    margin-bottom:18px;overflow:hidden;
  }
  .group-head{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    padding:14px 18px;border-bottom:1px solid var(--border-soft);background:var(--surface-2);
  }
  .group-head-left{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:none;border:none;padding:4px 4px 4px 0;margin:-4px 0;color:inherit;font-family:inherit;
    text-align:left;flex:1;min-width:0;
  }
  .collapse-chevron{
    display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;
    color:var(--text-3);font-size:13px;transition:transform .15s;
  }
  .collapse-chevron.collapsed{transform:rotate(-90deg);}
  .chip{
    font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:5px 12px;border-radius:999px;text-transform:uppercase;
  }
  .chip-dos{background:var(--cyan-bg);color:var(--cyan);}
  .chip-tres{background:var(--amber-bg);color:var(--amber);}
  .chip-libre{background:var(--success-bg);color:var(--success);}
  .chip-55{background:var(--violet-bg);color:var(--violet);}
  .group-meta{font-size:12.5px;color:var(--text-2);font-family:var(--font-mono);}
  .group-actions{display:flex;gap:8px;}

  .group-body{padding:6px 0 14px;overflow-x:auto;}
  table.shot-table{border-collapse:collapse;width:100%;min-width:480px;}
  table.shot-table th{
    font-family:var(--font-mono);font-size:10.5px;color:var(--text-3);text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;padding:10px 8px;text-align:center;white-space:nowrap;
  }
  table.shot-table th.th-player{text-align:left;padding-left:18px;position:sticky;left:0;background:var(--surface-1);}
  .th-pos{display:block;color:var(--amber);font-size:9.5px;text-transform:none;letter-spacing:0;margin-top:2px;}
  table.shot-table td{padding:6px 8px;text-align:center;vertical-align:middle;}
  table.shot-table td.td-player{
    text-align:left;padding-left:18px;position:sticky;left:0;background:var(--surface-1);
    display:flex;align-items:center;gap:9px;white-space:nowrap;
  }
  .mini-badge{
    width:28px;height:28px;border-radius:50%;background:var(--surface-3);border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:12px;
    color:var(--text-2);flex-shrink:0;
  }
  .td-name{font-size:13px;font-weight:600;}
  .td-baja-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);background:var(--surface-3);border-radius:5px;padding:2px 5px;flex-shrink:0;}

  .cell-btn{
    min-width:56px;min-height:44px;padding:8px 10px;background:var(--surface-2);border:1.5px solid var(--border);
    color:var(--text-1);border-radius:9px;font-family:var(--font-mono);font-size:14px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .cell-btn:hover{border-color:var(--amber);}
  .cell-btn:active{background:var(--surface-3);}
  .cell-btn.empty{color:var(--text-3);font-weight:600;font-size:12.5px;letter-spacing:.03em;}
  .cell-btn.incomplete{border-style:dashed;border-color:var(--amber);color:var(--amber);}
  .cell-nc{
    display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.03em;color:#1a1200;
    background:var(--amber);border-radius:4px;padding:1px 3px;margin-right:4px;vertical-align:middle;
  }
  .cell-sep{color:var(--text-3);margin:0 2px;}

  .add-serie-cell{padding:6px 10px;}
  .add-serie-btn{
    width:34px;height:34px;border-radius:8px;border:1.5px dashed var(--border);background:transparent;
    color:var(--text-3);display:flex;align-items:center;justify-content:center;font-size:17px;
  }
  .add-serie-btn:hover{border-color:var(--amber);color:var(--amber);}

  .group-empty-players{padding:22px 18px;color:var(--text-3);font-size:13px;}

  .new-group-btn{
    width:100%;padding:16px;border-radius:var(--radius-lg);border:1.5px dashed var(--border);
    background:transparent;color:var(--text-3);font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,color .15s;
  }
  .new-group-btn:hover{border-color:var(--amber);color:var(--amber);}

  .new-group-row{display:flex;gap:10px;flex-wrap:wrap;}
  .new-group-row .new-group-btn{width:auto;flex:1;min-width:180px;}
  .new-group-btn-55:hover{border-color:var(--violet);color:var(--violet);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,10,14,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
    overscroll-behavior:contain;
  }
  .modal-box{
    background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-box:focus{outline:none;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{font-size:17px;text-transform:none;color:var(--text-1);}
  .modal-close{color:var(--text-3);background:none;border:none;font-size:20px;line-height:1;padding:4px;}
  .modal-close:hover{color:var(--text-1);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px;}

  /* ---------- Entrada de serie (teclado grande) ---------- */
  .entry-head{text-align:center;margin-bottom:18px;}
  .entry-head .entry-player{font-size:16px;font-weight:700;color:var(--text-1);}
  .entry-head .entry-sub{font-size:12.5px;color:var(--text-3);margin-top:3px;}
  .step-dots{display:flex;justify-content:center;gap:7px;margin-bottom:16px;}
  .step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .step-dot.active{background:var(--amber);}

  .keypad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .keypad-btn{
    aspect-ratio:1;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border);
    color:var(--text-1);font-family:var(--font-mono);font-size:22px;font-weight:700;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .keypad-btn:hover{border-color:var(--amber);}
  .keypad-btn.active{background:var(--amber);border-color:var(--amber);color:#1a1200;}

  .digit-display{
    font-family:var(--font-mono);font-size:34px;font-weight:700;text-align:center;color:var(--text-1);
    background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;min-height:64px;
    display:flex;align-items:center;justify-content:center;
  }
  .digit-display .ph{color:var(--text-3);}
  .digit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .digit-btn{
    padding:20px 0;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--border);
    color:var(--text-1);font-family:var(--font-mono);font-size:23px;font-weight:700;transition:border-color .15s,background .15s;
  }
  .digit-btn:hover{border-color:var(--amber);}
  .digit-btn.action{background:var(--surface-3);color:var(--text-2);font-size:14px;font-weight:600;}

  .nc-btn{
    width:100%;margin-top:14px;padding:13px 14px;border-radius:10px;border:1.5px dashed var(--border);
    background:transparent;color:var(--text-3);font-weight:600;font-size:13px;text-align:center;
  }
  .nc-btn:hover{border-color:var(--danger);color:var(--danger);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:7px;}
  .field input[type=text],.field input[type=number]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text-1);
    border-radius:var(--radius-sm);padding:11px 12px;font-size:15px;
  }
  .field input:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  .field-hint{font-size:11.5px;color:var(--text-3);margin-top:6px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .segmented{display:flex;gap:8px;}
  .segmented button{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);
    padding:11px 6px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
    font-family:var(--font-display);letter-spacing:.02em;text-transform:uppercase;
  }
  .segmented button.active.dos{background:var(--cyan-bg);border-color:var(--cyan);color:var(--cyan);}
  .segmented button.active.tres{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
  .segmented button.active.libre{background:var(--success-bg);border-color:var(--success);color:var(--success);}

  .check-row{display:flex;flex-direction:column;gap:10px;}
  .check-toggle{
    display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:10px;
    border:1.5px solid var(--border);background:var(--surface-2);width:100%;text-align:left;transition:border-color .15s;
  }
  .check-toggle:hover{border-color:var(--amber);}
  .check-toggle .box{
    width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface-1);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .check-toggle.active .box{background:var(--amber);border-color:var(--amber);}
  .check-toggle .box svg{display:none;width:14px;height:14px;}
  .check-toggle.active .box svg{display:block;}
  .check-toggle .label{font-size:13.5px;font-weight:600;color:var(--text-1);}
  .check-toggle .sub{font-size:11px;color:var(--text-3);margin-left:auto;font-family:var(--font-mono);white-space:nowrap;}

  .presets-row{display:flex;flex-wrap:wrap;gap:8px;}
  .preset-btn{
    flex:1 1 auto;min-width:0;padding:12px 10px;border-radius:10px;border:1.5px dashed var(--amber);background:var(--amber-bg);
    color:var(--amber);font-weight:700;font-size:12.5px;text-align:center;white-space:nowrap;
  }
  .preset-btn:hover{background:var(--amber);color:#1a1200;}

  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper-btn{
    width:42px;height:42px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--border);
    color:var(--text-1);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .stepper-btn:hover{border-color:var(--amber);color:var(--amber);}
  .stepper-val{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--text-1);min-width:24px;text-align:center;}
  .stepper-val.muted{color:var(--text-3);font-size:13px;}

  .stepper-wide{justify-content:space-between;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:6px 8px;}
  .stepper-wide .stepper-btn{width:44px;height:44px;flex-shrink:0;background:var(--surface-3);}
  .stepper-wide .stepper-val{flex:1;font-size:19px;}

  .serie-pos-list{display:flex;flex-direction:column;gap:8px;}
  .serie-pos-row{display:flex;align-items:center;gap:10px;}
  .serie-pos-label{font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);width:26px;flex-shrink:0;}
  .segmented button.active.combinado{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}

  /* ---------- Estadísticas ---------- */
  .stats-filterbar{
    background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:16px 18px;margin-bottom:18px;display:flex;flex-direction:column;gap:16px;
  }
  .player-filter-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .pchip{
    padding:8px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface-2);
    color:var(--text-2);font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .pchip:hover{border-color:var(--text-3);}
  .pchip.active{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}

  .stats-section{
    background:var(--surface-1);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
    padding:18px;margin-bottom:18px;
  }
  .stats-section h3{
    font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--text-1);margin:0 0 14px;
  }
  .stats-section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .stats-section-head h3{margin:0 0 14px;}
  .stats-hint{font-size:12px;color:var(--text-3);margin:0 0 12px;}

  .rank-list{display:flex;flex-direction:column;gap:4px;}
  .rank-row{
    display:grid;grid-template-columns:26px 1fr 56px 84px;align-items:center;gap:10px;
    padding:9px 8px;border-radius:9px;background:transparent;border:1px solid transparent;text-align:left;width:100%;
  }
  button.rank-row{cursor:pointer;}
  button.rank-row:hover{border-color:var(--border);background:var(--surface-2);}
  button.rank-row.active{border-color:var(--amber);background:var(--amber-bg);}
  .rank-row.header{
    color:var(--text-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    font-family:var(--font-mono);font-weight:600;padding-bottom:8px;
  }
  .rank-num{font-family:var(--font-mono);font-size:12.5px;color:var(--text-3);text-align:center;}
  .rank-player{display:flex;align-items:center;gap:9px;min-width:0;}
  .rank-name{font-size:13.5px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-pct{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text-1);text-align:right;}
  .rank-made{font-family:var(--font-mono);font-size:12px;color:var(--text-3);text-align:right;}

  .chart-svg-wrap{overflow-x:auto;}
  .chart-svg{width:100%;min-width:480px;height:auto;display:block;}
  .chart-empty{padding:26px 10px;text-align:center;color:var(--text-3);font-size:13px;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  .vol-list{display:flex;flex-direction:column;gap:12px;}
  .vol-row{display:flex;flex-direction:column;gap:6px;}
  .vol-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .vol-label{display:flex;align-items:center;gap:9px;min-width:0;}
  .vol-name{font-size:13px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vol-value{font-family:var(--font-mono);font-size:12.5px;color:var(--text-3);flex-shrink:0;}
  .vol-bar-track{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
  .vol-bar-fill{height:100%;background:var(--amber);border-radius:5px;}

  table.shot-table.compare-table th.th-metric,
  table.shot-table.compare-table td.td-metric{
    text-align:left;padding-left:18px;position:sticky;left:0;background:var(--surface-1);white-space:nowrap;
  }
  table.shot-table.compare-table th{white-space:nowrap;}

  .heatmap-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .heat-cell{
    border:1.5px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center;
    background:var(--surface-2);
  }
  .heat-cell.empty{color:var(--text-3);}
  .heat-pos{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;opacity:.85;margin-bottom:6px;}
  .heat-pct{font-family:var(--font-display);font-size:21px;font-weight:700;line-height:1;}
  .heat-n{font-size:10px;margin-top:5px;opacity:.75;}
  .heat-legend{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:10.5px;color:var(--text-3);}
  .heat-legend-bar{flex:1;height:6px;border-radius:4px;background:linear-gradient(90deg, rgb(232,93,93), rgb(232,135,58), rgb(53,184,122));}

  .cond-list{display:flex;flex-direction:column;gap:12px;}
  .cond-row{display:flex;flex-direction:column;gap:6px;}
  .cond-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cond-label{font-size:13px;font-weight:600;color:var(--text-1);}
  .cond-value{font-family:var(--font-mono);font-size:12.5px;color:var(--text-2);flex-shrink:0;}
  .cond-n{color:var(--text-3);}
  .cond-bar-track{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
  .cond-bar-fill{height:100%;border-radius:5px;}

  .segmented.small{flex:1;flex-wrap:wrap;}
  .segmented.small button{padding:8px 4px;font-size:10.5px;}

  .confirm-msg{font-size:14px;color:var(--text-2);line-height:1.5;}

  /* ---------- Toast ---------- */
  #toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--surface-3);border:1px solid var(--border);color:var(--text-1);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:toast-in .2s ease-out;
  }
  .toast.error{border-color:var(--danger);color:var(--danger);}
  .toast.ok{border-color:var(--success);color:var(--success);}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:640px){
    .brand h1{font-size:17px;}
    .io-actions .btn span.long{display:none;}
    main{padding:18px 14px 32px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-wrap"></div>
<input type="file" id="importFileInput" accept=".yaml,.yml,text/yaml" style="display:none">

<script>
/* ============================================================
   ESTADO
   ============================================================ */
const POS_SHORT = {
  esq_izq:  "Corner L",
  "45_izq": "45° L",
  top:      "Top",
  "45_der": "45° R",
  esq_der:  "Corner R"
};
const RECORRIDO_POSICIONES = ['esq_izq','45_izq','top','45_der','esq_der'];
const TIPOS = {
  dos:   { label:"2 Puntos",     chip:"chip-dos"  },

// valor distinto — 2 triples, 2 de dos y 1 bandeja (que aquí vale solo 1
// punto, no 2, por diseño del ejercicio) — hasta 11 pts/posición, 55 en total.
const CINCUENTAYCINCO_MAX_TOTAL = 55;

let state = null;

function logSafe(method, ...args){
  // Este entorno de vista previa no siempre expone todos los métodos
  // habituales de la consola (p.ej. console.info puede no existir), así
  // que se comprueba cada uno antes de usarlo, con console.log como
  // respaldo, y sin lanzar nada si ni siquiera eso está disponible.
  try{
    if(typeof console !== 'undefined'){
      if(typeof console[method] === 'function') console[method](...args);
      else if(typeof console.log === 'function') console.log(...args);
    }
  }catch(e){ /* sin consola disponible; ignorar */ }
}

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
}
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function nowTimestampLocal(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  // "2026-08-31T14-05-30" (con guiones en la hora, seguro para nombres de archivo)
  return new Date(d - tz).toISOString().slice(0,19).replace(':', '-').replace(':', '-');
}
function defaultState(){
  return { version: 1, players: [], sessions: [], tab: 'jugadores', modal: null, currentDate: todayISO(), showBajas: false,
    statsFilters: { period: 'mes', from: null, to: null, playerIds: [], tipoView: 'combinado', rankingSort: 'pct', evoGranularity: 'dia' } };
}

/* ============================================================
   ALMACENAMIENTO
   Usa window.storage cuando la app corre como Artifact de Claude.
   Si se abre como archivo HTML independiente (fuera de Claude), recurre
   a localStorage. Si ni siquiera localStorage está disponible (por
   ejemplo, al abrir el archivo con file:// en Safari, donde el navegador
   puede bloquear el acceso), cae a un almacenamiento en memoria: la app
   sigue funcionando durante la sesión, aunque los datos no sobrevivan
   a recargar la página.
   ============================================================ */
function detectLocalStorage(){
  try{
    const testKey = '__control_tiros_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

const hasClaudeStorage = typeof window.storage !== 'undefined' && typeof window.storage.get === 'function';
const localStorageAvailable = detectLocalStorage();
const hasLocalStorage = !hasClaudeStorage && localStorageAvailable;
const memoryStore = {};
let storageModeWarning = null;
if(!hasClaudeStorage && !hasLocalStorage){
  storageModeWarning = 'Este navegador no permite guardar datos de forma persistente aquí (por ejemplo, al abrir el archivo directamente sin subirlo a un servidor). Los cambios se mantendrán solo mientras esta pestaña siga abierta.';
}

let claudeStorageBroken = false;

const storageAdapter = {
  async get(key){
    if(hasClaudeStorage && !claudeStorageBroken){
      // window.storage.get() lanza una excepción cuando la clave todavía no
      // existe (p.ej. la primera vez que se abre la app), en vez de
      // devolver null. Eso es un caso normal, no un error real, así que se
      // trata aquí y no se deja subir como fallo de lectura.
      try{
        return await window.storage.get(key, false);
      }catch(e){
        // Si hay una copia de seguridad local más reciente, se usa como
        // respaldo (p.ej. si el almacenamiento remoto tuvo un fallo puntual).
        if(localStorageAvailable){
          try{
            const raw = localStorage.getItem(key);
            if(raw != null) return { key, value: raw };
          }catch(e2){ /* ignorar */ }
        }
        return null;
      }
    }
    if(localStorageAvailable){
      const raw = localStorage.getItem(key);
      return raw != null ? { key, value: raw } : null;
    }
    return Object.prototype.hasOwnProperty.call(memoryStore, key) ? { key, value: memoryStore[key] } : null;
  },
  async set(key, value){
    // Copia de seguridad silenciosa en localStorage (si está disponible),
    // tanto si el almacenamiento de Claude funciona como si no.
    if(localStorageAvailable){
      try{ localStorage.setItem(key, value); }catch(e){ /* no crítico */ }
    } else {
      memoryStore[key] = value;
    }

    if(!hasClaudeStorage || claudeStorageBroken){
      return { key, value };
    }

    // Se intenta una sola vez: si falla, no es un problema pasajero (falla
    // igual la primera vez que la décima), así que reintentar solo repite
    // el mismo error en la consola sin ningún beneficio. Se marca como roto
    // de inmediato y se usa la copia local (ya escrita arriba) a partir de
    // ahora, sin volver a intentarlo en el resto de la sesión.
    try{
      return await window.storage.set(key, value, false);
    }catch(e){
      claudeStorageBroken = true;
      if(localStorageAvailable){
        showToast('Guardando solo en este dispositivo (no se pudo sincronizar con Claude)', 'error');
        return { key, value };
      }
      throw e;
    }
  }
};

let loadWarning = null;

async function loadState(){
  let res = null;
  try{
    res = await storageAdapter.get('app-state');
  }catch(e){
    logSafe('error', 'Error leyendo almacenamiento:', e);
    loadWarning = 'No se pudieron leer los datos guardados. Se ha iniciado con una plantilla vacía.';
    return defaultState();
  }
  if(!res || !res.value){
    return defaultState(); // primera vez, no hay nada guardado todavía (no es un error)
  }
  try{
    const parsed = JSON.parse(res.value);
    parsed.modal = null;
    // Los datos guardados antes de que existiera la pestaña de estadísticas
    // no tienen este campo; se completa aquí para no romper esa pantalla.
    if(!parsed.statsFilters){
      parsed.statsFilters = { period: 'mes', from: null, to: null, playerIds: [], tipoView: 'combinado', rankingSort: 'pct', evoGranularity: 'dia' };
    } else if(parsed.statsFilters.evoGranularity === undefined){
      // Añadido después: los datos guardados con una versión anterior de la
      // pestaña de estadísticas no tienen este campo todavía.
      parsed.statsFilters.evoGranularity = 'dia';
    }
    if(Array.isArray(parsed.players)) parsed.players.sort((a,b)=> (a.dorsal.length-b.dorsal.length) || a.dorsal.localeCompare(b.dorsal, undefined, {numeric:true}));
    return parsed;
  }catch(e){
    logSafe('error', 'Datos guardados corruptos:', e);
    loadWarning = 'Los datos guardados no se pudieron interpretar y no se han podido recuperar.';
    return defaultState();
  }
}
let dirtySinceExport = false;
let persistChain = Promise.resolve();

// No se espera (await) a que termine de guardar antes de refrescar la
// pantalla: el guardado ocurre en segundo plano para que tocar un valor
// se note instantáneo, pero se dispara de inmediato (sin agrupar/retrasar
// guardados) para que nunca haya una ventana de tiempo en la que un cambio
// reciente no esté ni siquiera en la copia de seguridad local. Los
// guardados se encolan (nunca en paralelo) y cada uno serializa el estado
// más reciente en el momento en que le toca escribir, así ningún guardado
// más lento puede pisar a uno más nuevo.
function persist(){
  dirtySinceExport = true;
  persistChain = persistChain.then(async () => {
    try{
      await storageAdapter.set('app-state', JSON.stringify(state));
    }catch(e){
      logSafe('error', e);
      showToast('No se ha podido guardar. Los últimos cambios podrían perderse.', 'error');
    }
  });
  return persistChain;
}

function showToast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2400);
}

function getSessionForDate(date){
  return state.sessions.find(s => s.fecha === date) || null;
}
function ensureSessionForDate(date){
  let s = getSessionForDate(date);
  if(!s){
    s = { id: uid(), fecha: date, groups: [] };
    state.sessions.push(s);
  }
  return s;
}
function findGroup(groupId){
  for(const s of state.sessions){
    const g = s.groups.find(g=>g.id===groupId);
    if(g) return g;
  }
  return null;
}
function ensurePlayerRow(group, playerId){
  if(!group.registros[playerId]){
    group.registros[playerId] = [];
  }
  const row = group.registros[playerId];
  while(row.length < group.numSeries){
    row.push({ anotados:0, intentados: group.lanzamientosFijos != null ? group.lanzamientosFijos : 0 });
  }
  return row;
}
function pct(a,b){
  if(!b) return '—';
  return Math.round((a/b)*100) + '%';
}

function sortPlayersByDorsal(){
  state.players.sort((a,b)=> (a.dorsal.length-b.dorsal.length) || a.dorsal.localeCompare(b.dorsal, undefined, {numeric:true}));
}
function activePlayers(){
  return state.players.filter(p => p.activo !== false);
}
function groupHasPlayerData(g, playerId){
  const row = g.registros[playerId];
  if(!row) return false;
  if(g.tipo === '55'){
    return !!(row.incompleta || row.score > 0);
  }
  return row.some(e => e.anotados > 0 || e.intentados > 0 || e.incompleta);
}
/* --- Ejercicio "55" --- */
// Solo se guarda la puntuación total que dice el jugador/entrenador
// (0-55), no el desglose tiro a tiro: en la práctica no se puede llevar
// ese detalle sobre la marcha. Por eso NO alimenta las estadísticas
// generales de % de 2/3 ni el mapa de posición — no hay forma de saber
// qué combinación exacta de aciertos dio ese total.
function ensure55PlayerEntry(group, playerId){
  if(!group.registros[playerId]) group.registros[playerId] = { score:0, incompleta:false };
  return group.registros[playerId];
}
function createGroup55(date){
  const session = ensureSessionForDate(date);
  const group = { id: uid(), tipo:'55', colapsado:false, registros:{} };
  activePlayers().forEach(p => ensure55PlayerEntry(group, p.id));
  session.groups.push(group);
  return group;
}
function setCellEntry55(groupId, playerId, score, incompleta){
  const g = findGroup(groupId);
  if(!g) return;
  const entry = ensure55PlayerEntry(g, playerId);
  let v = parseInt(score, 10); if(isNaN(v) || v < 0) v = 0;
  if(v > CINCUENTAYCINCO_MAX_TOTAL) v = CINCUENTAYCINCO_MAX_TOTAL;
  entry.incompleta = !!incompleta;
  entry.score = entry.incompleta ? 0 : v;
}
function score55Total(g, playerId){
  const e = g.registros[playerId];
  if(!e || e.incompleta) return 0;
  return e.score || 0;
}
// Descompone las filas de un grupo (de cualquier tipo) en entradas
// homogéneas {tipo, anotados, intentados, pos} para que las funciones de
// estadísticas no tengan que distinguir la forma interna de cada tipo de
// ejercicio. El "55" no aporta nada aquí (ver nota arriba): solo tiene su
// propio marcador, aparte.
function normalizeGroupEntries(g, pid){
  const row = g.registros[pid];
  if(!row) return [];
  if(g.tipo === '55') return [];
  const out = [];
  row.forEach((e,i)=>{
    if(!e || e.incompleta) return;
    out.push({ tipo: g.tipo, anotados: e.anotados, intentados: e.intentados, pos: g.posicionesPorSerie ? g.posicionesPorSerie[i] : null });
  });
  return out;
}
function addPlayer(nombre, dorsal){
  state.players.push({ id: uid(), nombre: nombre.trim(), dorsal: dorsal.trim(), activo: true });
  sortPlayersByDorsal();
}
function updatePlayer(id, nombre, dorsal){
  const p = state.players.find(p=>p.id===id);
  if(p){ p.nombre = nombre.trim(); p.dorsal = dorsal.trim(); }
  sortPlayersByDorsal();
}
function setPlayerActivo(id, activo){
  const p = state.players.find(p=>p.id===id);
  if(p) p.activo = activo;
}
function deletePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  state.sessions.forEach(s=> s.groups.forEach(g=>{ delete g.registros[id]; }));
}

/* ============================================================
   ACCIONES: GRUPOS DE SERIES
   ============================================================ */
function createGroup(date, tipo, series, lanzamientos, movimiento, bote, posicionesPorSerie){
  const session = ensureSessionForDate(date);
  const group = {
    id: uid(),
    tipo,
    posicionesPorSerie: posicionesPorSerie || null,
    seriesFijas: series,
    lanzamientosFijos: lanzamientos,
    numSeries: series != null ? series : 0,
    movimiento: !!movimiento,
    bote: !!bote,
    colapsado: false,
    registros: {}
  };
  activePlayers().forEach(p => ensurePlayerRow(group, p.id));
  session.groups.push(group);
  return group;
}
function updateGroup(groupId, tipo, series, lanzamientos, movimiento, bote, posicionesPorSerie){
  const g = findGroup(groupId);
  if(!g) return;
  g.tipo = tipo;
  g.posicionesPorSerie = posicionesPorSerie || null;
  g.seriesFijas = series;
  g.lanzamientosFijos = lanzamientos;
  g.movimiento = !!movimiento;
  g.bote = !!bote;
  if(series != null) g.numSeries = series;
  // Normaliza filas para los jugadores activos (nuevas o existentes) y para
  // cualquier jugador dado de baja que ya tuviera datos en este grupo
  // (así no se pierde ni se descuadra su histórico).
  const idsToNormalize = new Set([...Object.keys(g.registros), ...activePlayers().map(p=>p.id)]);
  idsToNormalize.forEach(pid=>{
    if(!g.registros[pid]) g.registros[pid] = [];
    let row = g.registros[pid];
    if(series != null && row.length > series) row.length = series;
    while(row.length < g.numSeries){
      row.push({ anotados:0, intentados: lanzamientos != null ? lanzamientos : 0 });
    }
    if(lanzamientos != null){
      row.forEach(e=>{
        e.intentados = lanzamientos;
        if(e.anotados > lanzamientos) e.anotados = lanzamientos;
      });
    }
  });
}
function deleteGroup(groupId){
  state.sessions.forEach(s=>{ s.groups = s.groups.filter(g=>g.id!==groupId); });
  state.sessions = state.sessions.filter(s=> s.groups.length>0 || s.fecha === state.currentDate);
}
function addSerieColumn(groupId){
  const g = findGroup(groupId);
  if(!g || g.seriesFijas != null) return;
  g.numSeries += 1;
  const idsToGrow = new Set([...Object.keys(g.registros), ...activePlayers().map(p=>p.id)]);
  idsToGrow.forEach(pid => ensurePlayerRow(g, pid));
}
function setCellEntry(groupId, playerId, serieIdx, anotados, intentados, incompleta){
  const g = findGroup(groupId);
  if(!g) return;
  const row = ensurePlayerRow(g, playerId);
  const entry = row[serieIdx];
  let a = parseInt(anotados, 10); if(isNaN(a) || a < 0) a = 0;
  let i = parseInt(intentados, 10); if(isNaN(i) || i < 0) i = 0;
  if(a > i) a = i;
  entry.anotados = a;
  entry.intentados = i;
  entry.incompleta = !!incompleta;
}

  }
  app.innerHTML = renderHeader() + '<main>' + (

    state.tab === 'entrenamiento' ? renderEntrenamiento() :
    renderEstadisticas()
  ) + '</main>' + (state.modal ? renderModal() : '');
  wireGlobalInputs();
  if(modalNowOpen && !modalOpenPrev){
    const box = app.querySelector('.modal-box');
    if(box) box.focus({preventScroll:true});
  } else if(!modalNowOpen && modalOpenPrev && lastFocusedBeforeModal){
    try{ lastFocusedBeforeModal.focus({preventScroll:true}); }catch(e){}
    lastFocusedBeforeModal = null;
  }
  modalOpenPrev = modalNowOpen;
}

function renderGroupCard(g){
  const tipoInfo = TIPOS[g.tipo];

/* ============================================================
   VISTA ESTADÍSTICAS
   ============================================================ */
function statsDateRange(filters){
  if(filters.period === 'rango') return { from: filters.from || null, to: filters.to || null };
  if(filters.period === 'todo') return { from: null, to: null };
  const to = todayISO();
  const d = new Date(to + 'T00:00:00');
  if(filters.period === 'semana') d.setDate(d.getDate() - 7);
  else if(filters.period === 'mes') d.setMonth(d.getMonth() - 1);
  else if(filters.period === '3meses') d.setMonth(d.getMonth() - 3);
  return { from: d.toISOString().slice(0,10), to };
}
function statsSessionsInRange(range){
  return state.sessions
    .filter(s => (!range.from || s.fecha >= range.from) && (!range.to || s.fecha <= range.to))
    .slice()
    .sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
// Jugadores a incluir en ranking/volumen/comparativa/evolución de equipo: los
// seleccionados en el filtro, o todos si no hay ninguno seleccionado (se
// descartan ids de jugadores eliminados que pudieran quedar del filtro).
function statsPlayerIds(filters){
  const validIds = new Set(state.players.map(p=>p.id));
  const selected = filters.playerIds.filter(id=>validIds.has(id));
  return selected.length ? selected : state.players.map(p=>p.id);
}
function emptyAgg(){ return { dos:{anotados:0,intentados:0}, tres:{anotados:0,intentados:0}, libre:{anotados:0,intentados:0} }; }
function aggCombined(a){
  return {
    anotados: a.dos.anotados + a.tres.anotados + a.libre.anotados,
    intentados: a.dos.intentados + a.tres.intentados + a.libre.intentados
  };
}
function aggForView(a, view){ return view === 'combinado' ? aggCombined(a) : a[view]; }
function computePlayerAgg(range, playerIds){
  const agg = {};
  playerIds.forEach(pid => { agg[pid] = emptyAgg(); });
  for(const s of statsSessionsInRange(range)){
    for(const g of s.groups){
      for(const pid of playerIds){
        for(const entry of normalizeGroupEntries(g, pid)){
          agg[pid][entry.tipo].anotados += entry.anotados;
          agg[pid][entry.tipo].intentados += entry.intentados;
        }
      }
    }
  }
  return agg;
}
function computeTeamEvolution(range, playerIds, view){
  const raw = [];
  for(const s of statsSessionsInRange(range)){
    let anotados = 0, intentados = 0;
    for(const g of s.groups){
      for(const pid of playerIds){
        for(const entry of normalizeGroupEntries(g, pid)){
          if(view !== 'combinado' && entry.tipo !== view) continue;
          anotados += entry.anotados; intentados += entry.intentados;
        }
      }
    }
    if(intentados > 0) raw.push({ fecha: s.fecha, anotados, intentados });
  }
  return raw;
}
function computePlayerEvolution(range, playerId, view){
  const raw = [];
  for(const s of statsSessionsInRange(range)){
    let anotados = 0, intentados = 0;
    for(const g of s.groups){
      for(const entry of normalizeGroupEntries(g, playerId)){
        if(view !== 'combinado' && entry.tipo !== view) continue;
        anotados += entry.anotados; intentados += entry.intentados;
      }
    }
    if(intentados > 0) raw.push({ fecha: s.fecha, anotados, intentados });
  }
  return raw;
}
// Lunes (formato YYYY-MM-DD) de la semana natural que contiene la fecha dada.
// Se usa como clave de agrupación semanal: ordena bien alfabéticamente y,
// mostrado como MM-DD en el eje X, indica "semana que empieza el...".
function mondayOf(fecha){
  const d = new Date(fecha + 'T00:00:00');
  const day = d.getDay(); // 0=domingo .. 6=sábado
  const diff = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}
// Agrupa puntos crudos (anotados/intentados por sesión) en puntos {fecha,pct}
// ya sea uno por día (tal cual) o sumados por semana natural (lunes-domingo)
// antes de calcular el porcentaje — nunca promediando porcentajes ya hechos.
function groupEvolutionPoints(raw, granularity){
  if(granularity !== 'semana'){
    return raw.map(p => ({ fecha: p.fecha, pct: p.anotados/p.intentados*100 }));
  }
  const buckets = {};
  raw.forEach(p=>{
    const key = mondayOf(p.fecha);
    if(!buckets[key]) buckets[key] = { anotados:0, intentados:0 };
    buckets[key].anotados += p.anotados;
    buckets[key].intentados += p.intentados;
  });
  return Object.keys(buckets).sort().map(key => ({ fecha: key, pct: buckets[key].anotados/buckets[key].intentados*100 }));
}

function buildLineChartSVG(series, maxY){
  maxY = maxY || 100;
  const opts = { width:640, height:220, padTop:16, padBottom:26, padLeft:36, padRight:14 };
  const allDates = Array.from(new Set(series.flatMap(s=>s.points.map(p=>p.fecha)))).sort();
  if(allDates.length === 0) return '<div class="chart-empty">Sin datos suficientes en este periodo.</div>';

  const plotW = opts.width - opts.padLeft - opts.padRight;
  const plotH = opts.height - opts.padTop - opts.padBottom;
  const xFor = fecha => {
    const idx = allDates.indexOf(fecha);
    return opts.padLeft + (allDates.length<=1 ? plotW/2 : (idx/(allDates.length-1))*plotW);
  };
  const yFor = val => opts.padTop + plotH - (Math.max(0,Math.min(maxY,val))/maxY)*plotH;

  let grid = '';
  [0, maxY*0.25, maxY*0.5, maxY*0.75, maxY].forEach(v=>{
    const y = yFor(v);
    grid += `<line x1="${opts.padLeft}" y1="${y.toFixed(1)}" x2="${opts.width-opts.padRight}" y2="${y.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>`;
    grid += `<text x="${opts.padLeft-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--text-3)" font-family="var(--font-mono)">${Math.round(v)}</text>`;
  });
  let xLabels = '';
  const labelEvery = Math.max(1, Math.ceil(allDates.length/6));
  allDates.forEach((f,i)=>{
    if(i % labelEvery !== 0 && i !== allDates.length-1) return;
    xLabels += `<text x="${xFor(f).toFixed(1)}" y="${opts.height-8}" text-anchor="middle" font-size="9" fill="var(--text-3)" font-family="var(--font-mono)">${f.slice(5)}</text>`;
  });
  let lines = '';
  series.forEach(s=>{
    if(!s.points.length) return;
    const d = s.points.map((p,i)=> `${i===0?'M':'L'}${xFor(p.fecha).toFixed(1)},${yFor(p.pct).toFixed(1)}`).join(' ');
    lines += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.points.forEach(p=>{
      lines += `<circle cx="${xFor(p.fecha).toFixed(1)}" cy="${yFor(p.pct).toFixed(1)}" r="3" fill="${s.color}"/>`;
    });
  });
  return `<div class="chart-svg-wrap"><svg viewBox="0 0 ${opts.width} ${opts.height}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${xLabels}${lines}</svg></div>`;
}
function renderLegend(series, unit){
  unit = unit === undefined ? '%' : unit;
  return `<div class="chart-legend">${series.map(s=>{
    const last = s.points.length ? s.points[s.points.length-1].pct : null;
    return `<span class="legend-item"><span class="legend-dot" style="background:${s.color}"></span>${escapeHtml(s.label)}${last!=null?` · ${Math.round(last)}${unit}`:''}</span>`;
  }).join('')}</div>`;
}

function renderVolumeSection(range, playerIds){

function renderComparisonSection(range, playerIds){
  const agg = computePlayerAgg(range, playerIds);
  const cols = playerIds.map(pid=>state.players.find(p=>p.id===pid))
    .filter(p=>p && aggCombined(agg[p.id]).intentados > 0);
  if(cols.length < 2){
    return emptyStatsBlock('Selecciona al menos dos jugadores (o amplía el periodo) para comparar.');
  }
  const metrics = [
    { label:'% combinado', fmt:pid=>pct(aggCombined(agg[pid]).anotados, aggCombined(agg[pid]).intentados) },
    { label:'Anotados (combinado)', fmt:pid=>aggCombined(agg[pid]).anotados },
    { label:'% 2 puntos', fmt:pid=>pct(agg[pid].dos.anotados, agg[pid].dos.intentados) },
    { label:'% 3 puntos', fmt:pid=>pct(agg[pid].tres.anotados, agg[pid].tres.intentados) },
    { label:'% tiro libre', fmt:pid=>pct(agg[pid].libre.anotados, agg[pid].libre.intentados) },
    { label:'Lanzamientos totales', fmt:pid=>aggCombined(agg[pid]).intentados }
  ];
  const thead = `<tr><th class="th-metric">Métrica</th>${cols.map(p=>`<th>${escapeHtml(p.dorsal)}<br>${escapeHtml(p.nombre)}</th>`).join('')}</tr>`;
  const rows = metrics.map(m=> `<tr><td class="td-metric">${m.label}</td>${cols.map(p=>`<td>${m.fmt(p.id)}</td>`).join('')}</tr>`).join('');
  return `<div class="group-body"><table class="shot-table compare-table"><thead>${thead}</thead><tbody>${rows}</tbody></table></div>`;
}

// Color de "calor" (rojo=flojo, ámbar=medio, verde=excelente) para un %.
// La escala 20%-65% está pensada para porcentajes reales de tiro exterior,
// no para 0-100%, que apenas se usaría en la práctica.
function heatColorRGB(pctVal){
  if(pctVal == null) return [107,115,134];
  const stops = [[232,93,93],[232,135,58],[53,184,122]];
  const t = Math.max(0, Math.min(1, (pctVal - 20) / (65 - 20)));
  let a, b, lt;
  if(t <= 0.5){ a = stops[0]; b = stops[1]; lt = t/0.5; } else { a = stops[1]; b = stops[2]; lt = (t-0.5)/0.5; }
  return a.map((v,i)=> Math.round(v + (b[i]-v)*lt));
}

/* --- 1. Mapa de calor por posición en cancha --- */
function computePositionAgg(range, playerIds, view){
  const posAgg = {};
  RECORRIDO_POSICIONES.forEach(pk => posAgg[pk] = { anotados:0, intentados:0 });
  for(const s of statsSessionsInRange(range)){
    for(const g of s.groups){
      for(const pid of playerIds){
        for(const entry of normalizeGroupEntries(g, pid)){
          if(entry.tipo === 'libre' || !entry.pos || !posAgg[entry.pos]) continue;
          if(view !== 'combinado' && entry.tipo !== view) continue;
          posAgg[entry.pos].anotados += entry.anotados;
          posAgg[entry.pos].intentados += entry.intentados;
        }
      }
    }
  }
  return posAgg;
}
function renderPositionHeatmap(range, playerIds, view){
  if(view === 'libre'){
    return emptyStatsBlock('El tiro libre no tiene posición en la cancha (siempre es el mismo punto).');
  }
  const agg = computePositionAgg(range, playerIds, view);
  const anyData = RECORRIDO_POSICIONES.some(pk => agg[pk].intentados > 0);
  if(!anyData) return emptyStatsBlock('Sin lanzamientos de 2 o 3 con posición registrada en este filtro.');
  const cells = RECORRIDO_POSICIONES.map(pk=>{
    const a = agg[pk];
    const has = a.intentados > 0;
    const pctVal = has ? a.anotados/a.intentados*100 : null;
    const [r,g,b] = heatColorRGB(pctVal);
    const style = has ? `background:rgba(${r},${g},${b},.22);border-color:rgba(${r},${g},${b},.7);color:rgb(${r},${g},${b});` : '';
    return `<div class="heat-cell ${has?'':'empty'}" style="${style}">
      <div class="heat-pos">${POS_SHORT[pk]}</div>
      <div class="heat-pct">${has ? Math.round(pctVal)+'%' : '—'}</div>
      <div class="heat-n">${has ? a.anotados+'/'+a.intentados : 'sin datos'}</div>
    </div>`;
  }).join('');
  return `
    <div class="heatmap-row">${cells}</div>
    <div class="heat-legend"><span>Flojo</span><span class="heat-legend-bar"></span><span>Excelente</span></div>`;
}

/* --- 2. Rendimiento según condición de tiro --- */
function computeConditionAgg(range, playerIds, view){
  const buckets = {
    estatico:   { label:'Estático (catch & shoot)', anotados:0, intentados:0 },
    movimiento: { label:'En movimiento',             anotados:0, intentados:0 },
    bote:       { label:'Tras bote',                 anotados:0, intentados:0 },
    ambos:      { label:'Movimiento + bote',         anotados:0, intentados:0 }
  };
  for(const s of statsSessionsInRange(range)){
    for(const g of s.groups){
      // El ejercicio "55" siempre es estático (de pie en cada posición), no
      // tiene los campos movimiento/bote propios de un grupo normal.
      const groupMovimiento = g.tipo === '55' ? false : !!g.movimiento;
      const groupBote = g.tipo === '55' ? false : !!g.bote;
      const key = groupMovimiento && groupBote ? 'ambos' : groupMovimiento ? 'movimiento' : groupBote ? 'bote' : 'estatico';
      for(const pid of playerIds){
        for(const entry of normalizeGroupEntries(g, pid)){
          if(entry.tipo === 'libre') continue;
          if(view !== 'combinado' && entry.tipo !== view) continue;
          buckets[key].anotados += entry.anotados;
          buckets[key].intentados += entry.intentados;
        }
      }
    }
  }
  return buckets;
}
function renderConditionSection(range, playerIds, view){
  if(view === 'libre'){
    return emptyStatsBlock('El tiro libre siempre es estático: esta comparación no aplica.');
  }
  const buckets = computeConditionAgg(range, playerIds, view);
  const rows = Object.values(buckets).filter(b=>b.intentados>0);
  if(!rows.length) return emptyStatsBlock('Sin lanzamientos de 2 o 3 puntos en este filtro.');
  return `<div class="cond-list">${rows.map(b=>{
    const pctVal = b.anotados/b.intentados*100;
    const [r,g,bl] = heatColorRGB(pctVal);
    return `<div class="cond-row">
      <div class="cond-top">
        <span class="cond-label">${b.label}</span>
        <span class="cond-value">${Math.round(pctVal)}% <span class="cond-n">(${b.anotados}/${b.intentados})</span></span>
      </div>
      <div class="cond-bar-track"><div class="cond-bar-fill" style="width:${Math.round(pctVal)}%;background:rgb(${r},${g},${bl});"></div></div>
    </div>`;
  }).join('')}</div>`;
}

/* --- 3. Forma reciente (racha / bajón) --- */
const FORM_RECENT_N = 3;
function computeFormRows(range, playerIds, view){
  const rows = [];
  for(const pid of playerIds){
    const p = state.players.find(pp=>pp.id===pid);
    if(!p) continue;
    const raw = computePlayerEvolution(range, pid, view); // ya viene ordenado por fecha ascendente
    if(raw.length < 2) continue;
    const totA = raw.reduce((s,r)=>s+r.anotados,0), totI = raw.reduce((s,r)=>s+r.intentados,0);
    const seasonPct = totI ? totA/totI*100 : null;
    const recent = raw.slice(-FORM_RECENT_N);
    const recA = recent.reduce((s,r)=>s+r.anotados,0), recI = recent.reduce((s,r)=>s+r.intentados,0);
    const recentPct = recI ? recA/recI*100 : null;
    if(seasonPct==null || recentPct==null) continue;
    rows.push({ id:pid, nombre:p.nombre, dorsal:p.dorsal, seasonPct, recentPct, delta: recentPct-seasonPct, n: recent.length });
  }
  rows.sort((a,b)=> b.delta - a.delta);
  return rows;
}
function renderFormSection(range, playerIds, view){
  const rows = computeFormRows(range, playerIds, view);
  if(!rows.length){
    return emptyStatsBlock('Hacen falta al menos 2 sesiones con datos por jugador para comparar su forma reciente.');
  }
  const body = rows.map(r=>{
    const deltaTxt = (r.delta>=0?'+':'') + Math.round(r.delta);
    const color = r.delta > 5 ? 'var(--success)' : r.delta < -5 ? 'var(--danger)' : 'var(--text-3)';
    return `<div class="rank-row">
      <span class="rank-num" style="color:${color};font-size:15px;">${r.delta>=0?'▲':'▼'}</span>
      <span class="rank-player"><span class="mini-badge">${escapeHtml(r.dorsal)}</span><span class="rank-name">${escapeHtml(r.nombre)}</span></span>
      <span class="rank-pct">${Math.round(r.seasonPct)}%</span>
      <span class="rank-made">${Math.round(r.recentPct)}% <span style="color:${color};">(${deltaTxt})</span></span>
    </div>`;
  }).join('');
  return `
    <p class="stats-hint">Compara el % de las últimas ${FORM_RECENT_N} sesiones de cada jugador contra su % en todo el periodo filtrado.</p>
    <div class="rank-list">
      <div class="rank-row header"><span></span><span>Jugador</span><span style="text-align:right;">Periodo</span><span style="text-align:right;">Últimas ${FORM_RECENT_N}</span></div>
      ${body}
    </div>`;
}

/* --- 4. Consistencia (variabilidad sesión a sesión) --- */
function computeConsistencyRows(range, playerIds, view){
  const rows = [];
  for(const pid of playerIds){
    const p = state.players.find(pp=>pp.id===pid);
    if(!p) continue;
    const raw = computePlayerEvolution(range, pid, view);
    if(raw.length < 3) continue;
    const pcts = raw.map(r => r.anotados/r.intentados*100);
    const mean = pcts.reduce((a,b)=>a+b,0) / pcts.length;
    const variance = pcts.reduce((a,b)=>a+(b-mean)*(b-mean),0) / pcts.length;
    rows.push({ id:pid, nombre:p.nombre, dorsal:p.dorsal, mean, stdev: Math.sqrt(variance), min: Math.min(...pcts), max: Math.max(...pcts), n: pcts.length });
  }
  rows.sort((a,b)=> a.stdev - b.stdev);
  return rows;
}
function renderConsistencySection(range, playerIds, view){
  const rows = computeConsistencyRows(range, playerIds, view);
  if(!rows.length){
    return emptyStatsBlock('Hacen falta al menos 3 sesiones con datos por jugador para calcular su consistencia.');
  }
  const body = rows.map((r,i)=> `
    <div class="rank-row">
      <span class="rank-num">${i+1}</span>
      <span class="rank-player"><span class="mini-badge">${escapeHtml(r.dorsal)}</span><span class="rank-name">${escapeHtml(r.nombre)}</span></span>
      <span class="rank-pct">${Math.round(r.mean)}%</span>
      <span class="rank-made">±${Math.round(r.stdev)} <span style="color:var(--text-3);">(${Math.round(r.min)}–${Math.round(r.max)}%)</span></span>
    </div>`
  ).join('');
  return `
    <p class="stats-hint">De más a menos regular (menor variación primero). ± indica cuánto sube y baja su % de una sesión a otra.</p>
    <div class="rank-list">
      <div class="rank-row header"><span></span><span>Jugador</span><span style="text-align:right;">Media</span><span style="text-align:right;">Variación</span></div>
      ${body}
    </div>`;
}

/* --- Ejercicio 55: marcador propio (separado de las estadísticas de %) --- */
function compute55Rows(range, playerIds){
  const rows = [];
  const sessions = statsSessionsInRange(range);
  for(const pid of playerIds){
    const p = state.players.find(pp=>pp.id===pid);
    if(!p) continue;
    const sessionScores = [];
    for(const s of sessions){
      let dayScore = null;
      for(const g of s.groups){
        if(g.tipo !== '55' || !g.registros[pid]) continue;
        const e = g.registros[pid];
        const hasData = e.incompleta || e.score > 0;
        if(hasData) dayScore = (dayScore || 0) + score55Total(g, pid);
      }
      if(dayScore != null) sessionScores.push({ fecha: s.fecha, pct: dayScore });
    }
    if(!sessionScores.length) continue;
    const best = Math.max(...sessionScores.map(x=>x.pct));
    const avg = sessionScores.reduce((a,b)=>a+b.pct,0) / sessionScores.length;
    const last = sessionScores[sessionScores.length-1].pct;
    rows.push({ id:pid, nombre:p.nombre, dorsal:p.dorsal, best, avg, last, n:sessionScores.length, sessionScores });
  }
  rows.sort((a,b)=> b.best - a.best);
  return rows;
}
function render55Section(range, playerIds, selectedIds){
  const rows = compute55Rows(range, playerIds);
  if(!rows.length){
    return emptyStatsBlock('Sin rondas del ejercicio 55 registradas con este filtro.');
  }
  const body = rows.map((r,i)=> `
    <div class="rank-row">
      <span class="rank-num">${i+1}</span>
      <span class="rank-player"><span class="mini-badge">${escapeHtml(r.dorsal)}</span><span class="rank-name">${escapeHtml(r.nombre)}</span></span>
      <span class="rank-pct">${r.best}<span class="cell-sep">/</span>${CINCUENTAYCINCO_MAX_TOTAL}</span>
      <span class="rank-made">media ${Math.round(r.avg)} · ${r.n} ronda${r.n===1?'':'s'}</span>
    </div>`
  ).join('');

  const ranking = `
    <p class="stats-hint">Mejor puntuación de cada jugador en el periodo, con su media y nº de rondas jugadas.</p>
    <div class="rank-list">
      <div class="rank-row header"><span></span><span>Jugador</span><span style="text-align:right;">Mejor</span><span style="text-align:right;">Media</span></div>
      ${body}
    </div>`;

  const evoIds = selectedIds.length ? selectedIds : rows.slice(0,1).map(r=>r.id);
  const series = evoIds.map((pid,i)=>{
    const row = rows.find(r=>r.id===pid);
    const p = state.players.find(pp=>pp.id===pid);
    return { label: p ? `${p.dorsal} · ${p.nombre}` : '?', color: colorForIndex(i), points: row ? row.sessionScores : [] };
  }).filter(s=>s.points.length);
  const evoHint = selectedIds.length
    ? 'Puntuación por ronda de los jugadores seleccionados arriba.'
    : `Sin selección, se muestra al jugador con mejor puntuación (${series[0] ? series[0].label : ''}). Selecciona jugadores arriba para comparar más.`;

  const evolution = series.length ? `
    <p class="stats-hint">${evoHint}</p>
    ${buildLineChartSVG(series, CINCUENTAYCINCO_MAX_TOTAL)}
    ${renderLegend(series, ' pts')}` : emptyStatsBlock('Sin rondas suficientes para dibujar la evolución.');

  return `${ranking}<div style="margin-top:20px;"><h3 style="font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-2);margin:0 0 10px;">Evolución de la puntuación</h3>${evolution}</div>`;
}

  return '';
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

   ============================================================ */
function stateToExportObj(){
  return {
    version: 1,
    exportado_en: new Date().toISOString(),
    jugadores: state.players.map(p => {
      const obj = { id:p.id, dorsal:p.dorsal, nombre:p.nombre };
      if(p.activo === false) obj.dado_de_baja = true;
      return obj;
    }),
    entrenamientos: [...state.sessions]
      .filter(s=>s.groups.length>0)
      .sort((a,b)=> a.fecha.localeCompare(b.fecha))
      .map(s => ({
        fecha: s.fecha,
        grupos: s.groups.map(g => {
          if(g.tipo === '55'){
            const obj = { tipo: '55' };
            obj.registros = state.players
              .filter(p => g.registros[p.id])
              .map(p => {
                const e = g.registros[p.id];
                const item = { jugador_id:p.id, dorsal:p.dorsal, nombre:p.nombre, puntuacion: e.score || 0 };
                if(e.incompleta) item.incompleta = true;
                return item;
              });
            return obj;
          }
          const obj = { tipo: g.tipo };
          if(g.seriesFijas != null) obj.series = g.seriesFijas;
          if(g.lanzamientosFijos != null) obj.lanzamientos_por_serie = g.lanzamientosFijos;
          if(g.movimiento) obj.movimiento = true;
          if(g.bote) obj.bote = true;
          if(g.posicionesPorSerie) obj.posiciones_por_serie = g.posicionesPorSerie;
          obj.registros = state.players
            .filter(p => g.registros[p.id] && g.registros[p.id].some(e=>e.intentados>0 || e.anotados>0) || g.registros[p.id])
            .map(p => ({
              jugador_id: p.id,
              dorsal: p.dorsal,
              nombre: p.nombre,
              series: (g.registros[p.id]||[]).map(e => e.incompleta ? { anotados:e.anotados, intentados:e.intentados, incompleta:true } : { anotados:e.anotados, intentados:e.intentados })
            }));
          return obj;
        })
      }))
  };
}

function exportYAML(){
  try{
    const obj = stateToExportObj();
    const yamlText = jsyaml.dump(obj, { noRefs:true, lineWidth:100 });
    const blob = new Blob([yamlText], { type:'text/yaml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `control-tiros-${nowTimestampLocal()}.yaml`;
    // target="_blank" es el respaldo para navegadores (típicamente Safari
    // en iPad/iOS) que no respetan el atributo "download" en un enlace: en
    // vez de forzar la descarga, navegan a la URL del blob. Sin esto lo
    // hacen en la misma pestaña y sustituyen la app; con esto se abre en
    // una pestaña nueva y la app original no se pierde.
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Se retrasa revocar la URL por si el navegador tarda en abrir la
    // pestaña/hoja para compartir; revocarla de inmediato podría dejarla
    // vacía en ese caso.
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    dirtySinceExport = false;
    render();
    showToast('YAML exportado', 'ok');
  }catch(e){
    logSafe('error', e);
    showToast('Error al exportar', 'error');
  }
}

const VALID_TIPOS = ['dos','tres','libre','55'];

function validateImportedData(data){
  if(!data || typeof data !== 'object') return 'El archivo no tiene el formato YAML esperado.';

  const jugadoresRaw = data.jugadores;
  if(jugadoresRaw != null && !Array.isArray(jugadoresRaw)) return 'El campo "jugadores" debería ser una lista.';
  const jugadores = jugadoresRaw || [];

  const seenIds = new Set();
  const seenDorsales = new Set();
  for(const p of jugadores){
    const dorsal = String((p && p.dorsal) ?? '').trim();
    if(!dorsal) return `Hay un jugador (${(p && p.nombre) || 'sin nombre'}) sin dorsal.`;
    if(seenDorsales.has(dorsal)) return `El dorsal "${dorsal}" está repetido en la plantilla del archivo.`;
    seenDorsales.add(dorsal);
    if(p && p.id){
      if(seenIds.has(p.id)) return `Hay un id de jugador duplicado en el archivo: "${p.id}".`;
      seenIds.add(p.id);
    }
  }
  const jugadorConocido = (ref) => jugadores.some(p => p.id === ref || String(p.dorsal) === String(ref));

  const entrenamientos = data.entrenamientos;
  if(entrenamientos != null && !Array.isArray(entrenamientos)) return 'El campo "entrenamientos" debería ser una lista.';
  for(const s of (entrenamientos || [])){
    if(!s || typeof s.fecha !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s.fecha)){
      return `Hay un entrenamiento con una fecha no válida (se espera AAAA-MM-DD): "${s && s.fecha}".`;
    }
    const grupos = s.grupos;
    if(grupos != null && !Array.isArray(grupos)) return `El entrenamiento del ${s.fecha} tiene un campo "grupos" que debería ser una lista.`;
    for(const g of (grupos || [])){
      if(!g || !VALID_TIPOS.includes(g.tipo)){
        return `El entrenamiento del ${s.fecha} tiene un grupo con un tipo de tiro desconocido: "${g && g.tipo}".`;
      }
      if(g.posiciones_por_serie != null){
        if(!Array.isArray(g.posiciones_por_serie)) return `El entrenamiento del ${s.fecha} tiene un campo "posiciones_por_serie" que debería ser una lista.`;
        for(const pos of g.posiciones_por_serie){
          if(!RECORRIDO_POSICIONES.includes(pos)){
            return `El entrenamiento del ${s.fecha} tiene una posición de serie desconocida: "${pos}".`;
          }
        }
      }
      if(g.series != null && (!Number.isFinite(Number(g.series)) || Number(g.series) < 1)){
        return `El entrenamiento del ${s.fecha} tiene un número de series no válido: "${g.series}".`;
      }
      if(g.lanzamientos_por_serie != null && (!Number.isFinite(Number(g.lanzamientos_por_serie)) || Number(g.lanzamientos_por_serie) < 1)){
        return `El entrenamiento del ${s.fecha} tiene un número de lanzamientos por serie no válido: "${g.lanzamientos_por_serie}".`;
      }
      for(const r of (g.registros || [])){
        const ref = r && (r.jugador_id || r.dorsal);
        if(ref == null || !jugadorConocido(ref)){
          return `El entrenamiento del ${s.fecha} tiene un registro de tiro de un jugador que no existe en la plantilla del archivo (${(r && r.nombre) || ref || 'desconocido'}).`;
        }
        if(g.tipo === '55'){
          if(r.puntuacion != null && (!Number.isFinite(Number(r.puntuacion)) || Number(r.puntuacion) < 0)){
            return `Hay una puntuación del ejercicio 55 no válida (${s.fecha}, ${(r && r.nombre) || ref}).`;
          }
          continue;
        }
        for(const se of ((r && r.series) || [])){
          if(se.anotados != null && (!Number.isFinite(Number(se.anotados)) || Number(se.anotados) < 0)){
            return `Hay una serie con un número de anotados no válido (${s.fecha}, ${(r && r.nombre) || ref}).`;
          }
          if(se.intentados != null && (!Number.isFinite(Number(se.intentados)) || Number(se.intentados) < 0)){
            return `Hay una serie con un número de lanzamientos no válido (${s.fecha}, ${(r && r.nombre) || ref}).`;
          }
        }
      }
    }
  }
  return null;
}

function parseYAMLToState(text){
  const data = jsyaml.load(text);
  const validationError = validateImportedData(data);
  if(validationError) throw new Error(validationError);

  const players = (data.jugadores || []).map(p => ({
    id: p.id || uid(),
    dorsal: String(p.dorsal ?? ''),
    nombre: String(p.nombre ?? ''),
    activo: !p.dado_de_baja
  }));
  const dorsalToId = {};
  players.forEach(p=> dorsalToId[p.dorsal] = p.id);

  const sessions = (data.entrenamientos || []).map(s => ({
    id: uid(),
    fecha: s.fecha,
    groups: (s.grupos || []).map(g => {
      if(g.tipo === '55'){
        const registros = {};
        (g.registros || []).forEach(r => {
          const pid = r.jugador_id && players.some(p=>p.id===r.jugador_id) ? r.jugador_id : dorsalToId[String(r.dorsal)];
          if(!pid) return;
          let score = Number(r.puntuacion) || 0;
          if(score < 0) score = 0;
          if(score > CINCUENTAYCINCO_MAX_TOTAL) score = CINCUENTAYCINCO_MAX_TOTAL;
          registros[pid] = { score, incompleta: !!r.incompleta };
        });
        return { id: uid(), tipo:'55', colapsado:false, registros };
      }
      const seriesFijas = (g.series !== undefined && g.series !== null) ? Number(g.series) : null;
      const lanzamientosFijos = (g.lanzamientos_por_serie !== undefined && g.lanzamientos_por_serie !== null) ? Number(g.lanzamientos_por_serie) : null;
      const registros = {};
      let maxSeries = seriesFijas || 0;
      (g.registros || []).forEach(r => {
        const pid = r.jugador_id && players.some(p=>p.id===r.jugador_id) ? r.jugador_id : dorsalToId[String(r.dorsal)];
        if(!pid) return;
        const series = (r.series || []).map(se => ({ anotados: Number(se.anotados)||0, intentados: Number(se.intentados)||0, incompleta: !!se.incompleta }));
        registros[pid] = series;
        if(series.length > maxSeries) maxSeries = series.length;
      });
      return {
        id: uid(),
        tipo: g.tipo,
        seriesFijas,
        lanzamientosFijos,
        numSeries: maxSeries,
        movimiento: !!g.movimiento,
        bote: !!g.bote,
        posicionesPorSerie: Array.isArray(g.posiciones_por_serie) ? g.posiciones_por_serie : null,
        registros
      };
    })
  }));

  return { players, sessions };
}
