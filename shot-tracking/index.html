document.addEventListener('keydown', (e) => {
  if(!state.modal) return;
  if(e.key === 'Escape'){
    e.preventDefault();
    state.modal = null; render();
    return;
  }
  if(e.key === 'Tab'){
    const box = document.querySelector('.modal-box');
    if(!box) return;
    const focusables = Array.prototype.slice.call(
      box.querySelectorAll('button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    );
    if(!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){
      e.preventDefault(); last.focus();
    } else if(!e.shiftKey && document.activeElement === last){
      e.preventDefault(); first.focus();
    }
  }
});

document.addEventListener('click', async (e) => {
  const overlay = e.target.closest('[data-action="overlay-close"]');
  if(overlay && !e.target.closest('[data-stop]')){
    state.modal = null; render(); return;
  }

  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case 'set-tab':
      state.tab = btn.dataset.tab; state.modal = null; render(); break;

    case 'open-add-player':
      state.modal = { type:'add-player' }; render();
      setTimeout(()=>document.getElementById('f-nombre')?.focus(), 30);
      break;

    case 'edit-player':
      state.modal = { type:'edit-player', id: btn.dataset.id }; render();
      break;

    case 'save-add-player': {
      const nombre = document.getElementById('f-nombre').value.trim();
      const dorsal = document.getElementById('f-dorsal').value.trim();
      const err = validatePlayer(nombre, dorsal, null);
      if(err){ showFieldError(err); return; }
      addPlayer(nombre, dorsal);
      state.modal = null;
      persist(); render();
      showToast('Jugador añadido', 'ok');
      break;
    }
    case 'save-edit-player': {
      const id = btn.dataset.id;
      const nombre = document.getElementById('f-nombre').value.trim();
      const dorsal = document.getElementById('f-dorsal').value.trim();
      const err = validatePlayer(nombre, dorsal, id);
      if(err){ showFieldError(err); return; }
      updatePlayer(id, nombre, dorsal);
      state.modal = null;
      persist(); render();
      showToast('Cambios guardados', 'ok');
      break;
    }
    case 'ask-delete-player':
      state.modal = { type:'confirm', title:'Eliminar jugador definitivamente',
        message:'Se eliminará el jugador y todo su histórico de tiros para siempre. Esta acción no se puede deshacer. Si solo quieres que deje de aparecer en nuevos entrenamientos, usa "Dar de baja" en su lugar.',
        pending:{ kind:'delete-player', id: btn.dataset.id } };
      render();
      break;

    case 'give-baja-player':
      setPlayerActivo(btn.dataset.id, false);
      persist(); render();
      showToast('Jugador dado de baja', 'ok');
      break;

    case 'reactivate-player':
      setPlayerActivo(btn.dataset.id, true);
      persist(); render();
      showToast('Jugador reactivado', 'ok');
      break;

    case 'toggle-bajas':
      state.showBajas = !state.showBajas;
      render();
      break;

    case 'open-new-group':
      state.modal = { type:'new-group', editing:false, draft:{ tipo:null, series:'1', lanzamientos:'10', movimiento:false, bote:false, posicionesPorSerie:[] } };
      render();
      break;

    case 'create-55':
      createGroup55(state.currentDate);
      persist(); render();
      showToast('Ejercicio 55 creado', 'ok');
      break;

    case 'open-cell-55': {
      const entry = ensure55PlayerEntry(findGroup(btn.dataset.group), btn.dataset.player);
      state.modal = { type:'cell-entry-55', groupId:btn.dataset.group, playerId:btn.dataset.player,
        digitBuffer: (!entry.incompleta && entry.score) ? String(entry.score) : '' };
      render();
      break;
    }

    case 'digit-press-55': {
      const d = state.modal;
      if(d.digitBuffer.length < 2) d.digitBuffer += btn.dataset.val;
      render();
      break;
    }
    case 'digit-back-55':
      state.modal.digitBuffer = state.modal.digitBuffer.slice(0,-1);
      render();
      break;
    case 'digit-clear-55':
      state.modal.digitBuffer = '';
      render();
      break;

    case 'cell-save-55': {
      const d = state.modal;
      setCellEntry55(d.groupId, d.playerId, d.digitBuffer || '0', false);
      state.modal = null;
      persist(); render();
      break;
    }

    case 'mark-incompleta-55': {
      const d = state.modal;
      setCellEntry55(d.groupId, d.playerId, 0, true);
      state.modal = null;
      persist(); render();
      break;
    }

    case 'edit-group': {
      const g = findGroup(btn.dataset.id);
      if(!g) break;
      const usesPos = g.tipo === 'dos' || g.tipo === 'tres';
      let posicionesPorSerie = [];
      if(usesPos){
        const n = g.seriesFijas != null ? g.seriesFijas : 5;
        posicionesPorSerie = Array.from({length:n}, (_,i)=> g.posicionesPorSerie[i] || RECORRIDO_POSICIONES[i % RECORRIDO_POSICIONES.length]);
      }
      state.modal = { type:'new-group', editing:true, groupId:g.id, draft:{
        tipo: g.tipo,
        series: g.seriesFijas != null ? String(g.seriesFijas) : (usesPos ? '5' : ''),
        lanzamientos: g.lanzamientosFijos != null ? String(g.lanzamientosFijos) : '',
        movimiento: !!g.movimiento,
        bote: !!g.bote,
        posicionesPorSerie
      }};
      render();
      break;
    }

    case 'draft-tipo': {
      const d = state.modal.draft;
      d.tipo = btn.dataset.val;
      if(d.tipo === 'libre'){
        d.posicionesPorSerie = [];
      } else {
        // 2 puntos / 3 puntos: la posición siempre se asigna por serie,
        // así que el número de series debe ser un valor concreto.
        let n = parseInt(d.series,10);
        if(!n || n<1) n = 5;
        d.series = String(n);
        d.posicionesPorSerie = Array.from({length:n}, (_,i)=> d.posicionesPorSerie[i] || RECORRIDO_POSICIONES[i % RECORRIDO_POSICIONES.length]);
      }
      render();
      break;
    }

    case 'draft-toggle':
      state.modal.draft[btn.dataset.field] = !state.modal.draft[btn.dataset.field];
      render();
      break;

    case 'draft-series-step': {
      const d = state.modal.draft;
      const delta = Number(btn.dataset.delta);
      // Si aún no se ha elegido un tipo y se empieza a pedir series, asumimos
      // 3 puntos por defecto para poder mostrar ya la posición de cada serie.
      if(!d.tipo && delta > 0) d.tipo = 'tres';
      const usesPos = d.tipo === 'dos' || d.tipo === 'tres';
      const floor = usesPos ? 1 : 0;
      let current = d.series === '' ? 0 : (parseInt(d.series,10) || 0);
      let n = Math.max(floor, current + delta);
      d.series = n === 0 ? '' : String(n);
      if(usesPos){
        const len = Math.max(1, n);
        d.posicionesPorSerie = Array.from({length:len}, (_,i)=> d.posicionesPorSerie[i] || RECORRIDO_POSICIONES[i % RECORRIDO_POSICIONES.length]);
      }
      render();
      break;
    }

    case 'draft-lanz-step': {
      const d = state.modal.draft;
      const delta = Number(btn.dataset.delta);
      let current = d.lanzamientos === '' ? 0 : (parseInt(d.lanzamientos,10) || 0);
      let n = Math.max(0, current + delta);
      d.lanzamientos = n === 0 ? '' : String(n);
      render();
      break;
    }

    case 'draft-posicion-serie': {
      const d = state.modal.draft;
      d.posicionesPorSerie[Number(btn.dataset.idx)] = btn.dataset.val;
      render();
      break;
    }

    case 'apply-recorrido': {
      const d = state.modal.draft;
      // Funciona en cualquier momento: si no hay tipo elegido o está en Tiro
      // libre (no admite posiciones), pasa a 3 Puntos por defecto.
      if(!d.tipo || d.tipo === 'libre') d.tipo = 'tres';
      d.series = '5';
      d.lanzamientos = '10';
      d.posicionesPorSerie = RECORRIDO_POSICIONES.slice();
      render();
      break;
    }

    case 'apply-libres-2x2': {
      const d = state.modal.draft;
      d.tipo = 'libre';
      d.posicionesPorSerie = [];
      d.series = '2';
      d.lanzamientos = '2';
      render();
      break;
    }

    case 'save-new-group': {
      const draft = state.modal.draft;
      const usesPos = draft.tipo === 'dos' || draft.tipo === 'tres';
      let series, lanzamientos, posicionesPorSerie = null;
      series = draft.series === '' ? null : Math.max(1, parseInt(draft.series,10) || 1);
      lanzamientos = draft.lanzamientos === '' ? null : Math.max(1, parseInt(draft.lanzamientos,10) || 1);
      if(usesPos){
        series = series || 5;
        posicionesPorSerie = draft.posicionesPorSerie.slice(0, series);
      }
      if(state.modal.editing){
        updateGroup(state.modal.groupId, draft.tipo, series, lanzamientos, draft.movimiento, draft.bote, posicionesPorSerie);
        state.modal = null;
        persist(); render();
        showToast('Grupo actualizado', 'ok');
      } else {
        createGroup(state.currentDate, draft.tipo, series, lanzamientos, draft.movimiento, draft.bote, posicionesPorSerie);
        state.modal = null;
        persist(); render();
        showToast('Grupo de series creado', 'ok');
      }
      break;
    }

    case 'ask-delete-group':
      state.modal = { type:'confirm', title:'Eliminar grupo de series',
        message:'Se eliminará este grupo y todos los registros de tiro asociados.',
        pending:{ kind:'delete-group', id: btn.dataset.id } };
      render();
      break;

    case 'add-serie':
      addSerieColumn(btn.dataset.group);
      persist(); render();
      break;

    case 'toggle-group-collapse': {
      const g = findGroup(btn.dataset.id);
      if(g){ g.colapsado = !g.colapsado; render(); }
      break;
    }

    case 'toggle-all-groups': {
      const session = getSessionForDate(state.currentDate);
      if(session){
        const collapseAll = btn.dataset.mode === 'collapse';
        session.groups.forEach(g => { g.colapsado = collapseAll; });
        render();
      }
      break;
    }

    case 'confirm-yes': {
      const pending = state.modal.pending;
      if(pending.kind === 'delete-player') deletePlayer(pending.id);
      if(pending.kind === 'delete-group') deleteGroup(pending.id);
      state.modal = null;
      persist(); render();
      showToast('Eliminado', 'ok');
      break;
    }

    case 'close-modal':
      state.modal = null; render(); break;

    case 'export-yaml':
      exportYAML(); break;

    case 'open-import':
      document.getElementById('importFileInput').click();
      break;

    case 'confirm-import': {
      const pending = state.modal.pendingImport;
      state.players = pending.players;
      state.sessions = pending.sessions;
      sortPlayersByDorsal();
      state.modal = null;
      persist();
      dirtySinceExport = false;
      render();
      showToast('Datos importados', 'ok');
      break;
    }

    case 'open-cell': {
      const g = findGroup(btn.dataset.group);
      const serieIdx = Number(btn.dataset.serie);
      const entry = ensurePlayerRow(g, btn.dataset.player)[serieIdx];
      const fixedLanz = g.lanzamientosFijos;
      if(fixedLanz != null){
        state.modal = { type:'cell-entry', groupId:btn.dataset.group, playerId:btn.dataset.player, serieIdx,
          fixedLanz, fixed:true, anotados: entry.incompleta ? null : entry.anotados };
      } else {
        state.modal = { type:'cell-entry', groupId:btn.dataset.group, playerId:btn.dataset.player, serieIdx,
          fixedLanz, fixed:false, step:'intentados', intentados:entry.intentados, anotados:entry.anotados,
          digitBuffer: entry.intentados ? String(entry.intentados) : '' };
      }
      render();
      break;
    }

    case 'mark-incompleta': {
      const d = state.modal;
      setCellEntry(d.groupId, d.playerId, d.serieIdx, 0, 0, true);
      state.modal = null;
      persist(); render();
      break;
    }

    case 'set-fixed-anotados': {
      const d = state.modal;
      setCellEntry(d.groupId, d.playerId, d.serieIdx, btn.dataset.val, d.fixedLanz, false);
      state.modal = null;
      persist(); render();
      break;
    }

    case 'digit-press': {
      const d = state.modal;
      if(d.digitBuffer.length < 3) d.digitBuffer += btn.dataset.val;
      render();
      break;
    }
    case 'digit-back':
      state.modal.digitBuffer = state.modal.digitBuffer.slice(0,-1);
      render();
      break;
    case 'digit-clear':
      state.modal.digitBuffer = '';
      render();
      break;

    case 'cell-step-continue': {
      const d = state.modal;
      let n = Math.max(0, parseInt(d.digitBuffer || '0', 10));
      if(d.fixedLanz != null) n = Math.min(n, d.fixedLanz);
      d.intentados = n;
      d.anotados = Math.min(d.anotados, d.intentados);
      d.step = 'anotados';
      d.digitBuffer = d.anotados ? String(d.anotados) : '';
      render();
      break;
    }
    case 'cell-step-back': {
      const d = state.modal;
      d.step = 'intentados';
      d.digitBuffer = d.intentados ? String(d.intentados) : '';
      render();
      break;
    }

    case 'set-free-anotados': {
      const d = state.modal;
      setCellEntry(d.groupId, d.playerId, d.serieIdx, btn.dataset.val, d.intentados, false);
      state.modal = null;
      persist(); render();
      break;
    }
    case 'cell-save-digit': {
      const d = state.modal;
      const val = Math.min(parseInt(d.digitBuffer || '0', 10), d.intentados);
      setCellEntry(d.groupId, d.playerId, d.serieIdx, val, d.intentados, false);
      state.modal = null;
      persist(); render();
      break;
    }

    case 'stats-set-period':
      state.statsFilters.period = btn.dataset.period;
      render();
      break;

    case 'stats-set-tipoview':
      state.statsFilters.tipoView = btn.dataset.tipo;
      render();
      break;

    case 'stats-set-evo-granularity':
      state.statsFilters.evoGranularity = btn.dataset.gran;
      render();
      break;

    case 'stats-rank-sort':
      state.statsFilters.rankingSort = btn.dataset.sort;
      render();
      break;

    case 'stats-players-all':
      state.statsFilters.playerIds = [];
      render();
      break;

    case 'stats-toggle-player': {
      const id = btn.dataset.id;
      const idx = state.statsFilters.playerIds.indexOf(id);
      if(idx === -1) state.statsFilters.playerIds.push(id);
      else state.statsFilters.playerIds.splice(idx,1);
      render();
      break;
    }
  }
});

document.getElementById('importFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const parsed = parseYAMLToState(evt.target.result);
      state.modal = {
        type:'import-confirm',
        playerCount: parsed.players.length,
        sessionCount: parsed.sessions.length,
        pendingImport: parsed
      };
      render();
    }catch(err){
      logSafe('error', err);
      showToast(err && err.message ? err.message : 'El archivo YAML no tiene un formato válido', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function validatePlayer(nombre, dorsal, editingId){
  if(!nombre) return 'El nombre es obligatorio.';
  if(!dorsal) return 'El dorsal es obligatorio.';
  const dup = state.players.find(p => p.dorsal === dorsal && p.id !== editingId);
  if(dup) return `Ya existe un jugador con el dorsal ${dorsal}.`;
  return null;
}
function showFieldError(msg){
  const el = document.getElementById('modal-error');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

/* ============================================================
   INICIO
   ============================================================ */
(async function init(){
  state = await loadState();
  render();
  if(loadWarning){ showToast(loadWarning, 'error'); loadWarning = null; }
  else if(storageModeWarning){ showToast(storageModeWarning, 'error'); }
})();
</script>
